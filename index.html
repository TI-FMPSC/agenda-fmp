<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b5cab" />
  <title>Agenda de Espaços FMP</title>
  <style>
    :root{
      --primary:#0b5cab;
      --primary-2:#073f79;
      --success:#138a59;
      --success-soft:#e7f7ef;
      --warning:#c47a00;
      --danger:#c23737;
      --ink:#182230;
      --muted:#667085;
      --line:#dbe3ed;
      --surface:#ffffff;
      --surface-2:#f4f7fb;
      --shadow:0 12px 35px rgba(19,42,76,.12);
      --radius:18px;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--surface-2)}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    .hidden{display:none!important}
    .app{min-height:100vh}
    .btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;display:inline-flex;align-items:center;gap:8px;justify-content:center;transition:.2s}
    .btn:hover{transform:translateY(-1px)}
    .btn-primary{background:var(--primary);color:#fff;box-shadow:0 7px 16px rgba(11,92,171,.22)}
    .btn-secondary{background:#fff;color:var(--primary);border:1px solid #bed1e6}
    .btn-success{background:var(--success);color:#fff}
    .btn-ghost{background:transparent;color:var(--ink)}
    .btn-danger{background:#fff0f0;color:var(--danger);border:1px solid #ffd0d0}
    .icon-btn{width:42px;height:42px;padding:0;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink)}
    .tag{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800}
    .tag-blue{color:var(--primary);background:#eaf3fc}.tag-green{color:var(--success);background:var(--success-soft)}
    .tag-orange{color:#995d00;background:#fff3dc}.tag-gray{color:#5b6675;background:#edf1f5}
    .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
    .logo{width:48px;height:48px;border-radius:14px;background:linear-gradient(145deg,var(--primary),#2b86d8);color:#fff;display:grid;place-items:center;font-weight:900;letter-spacing:.5px;overflow:hidden;box-shadow:0 8px 20px rgba(11,92,171,.22)}
    .logo img{width:100%;height:100%;object-fit:contain;background:#fff}

    /* Login */
    .login-page{min-height:100vh;display:grid;grid-template-columns:1.08fr .92fr;background:#fff}
    .login-brand{position:relative;overflow:hidden;padding:70px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;background:linear-gradient(145deg,#062d57 0%,var(--primary) 56%,#0b8b66 145%)}
    .login-brand:before,.login-brand:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.08)}
    .login-brand:before{width:430px;height:430px;right:-180px;top:-120px}.login-brand:after{width:260px;height:260px;left:-100px;bottom:-90px}
    .brand-head{display:flex;align-items:center;gap:14px;position:relative;z-index:2}.brand-head .logo{background:#fff;color:var(--primary)}
    .brand-title{font-size:42px;line-height:1.08;margin:0;max-width:650px;position:relative;z-index:2}
    .brand-sub{font-size:18px;line-height:1.55;opacity:.9;max-width:590px;position:relative;z-index:2}
    .brand-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;position:relative;z-index:2}
    .brand-card{padding:18px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.09);border-radius:16px;backdrop-filter:blur(9px)}
    .brand-card strong{display:block;font-size:20px;margin-bottom:6px}.brand-card span{font-size:13px;opacity:.82}
    .login-box-wrap{display:grid;place-items:center;padding:42px}
    .login-box{width:min(440px,100%)}
    .login-box h2{font-size:30px;margin:18px 0 8px}.login-box p{color:var(--muted);margin:0 0 28px;line-height:1.5}
    .field{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}.field label{font-size:13px;font-weight:800;color:#344054}
    .field input,.field select,.field textarea{border:1px solid #cdd8e5;border-radius:12px;padding:12px 13px;background:#fff;color:var(--ink);outline:0}
    .field input:focus,.field select:focus,.field textarea:focus{border-color:#5d9bd5;box-shadow:0 0 0 4px rgba(11,92,171,.1)}
    .login-actions{display:grid;gap:10px;margin-top:22px}.demo-info{margin-top:18px;padding:12px;border-radius:12px;background:#f5f8fc;color:#536174;font-size:13px;line-height:1.45}

    /* Admin shell */
    .shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
    .sidebar{background:#081d35;color:#fff;padding:22px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
    .side-brand{display:flex;align-items:center;gap:12px;padding:4px 8px 22px;border-bottom:1px solid rgba(255,255,255,.09)}
    .side-brand strong{display:block}.side-brand small{color:#a9bdd3}
    .nav{display:grid;gap:6px;margin-top:20px}.nav button{display:flex;align-items:center;gap:11px;text-align:left;border:0;border-radius:11px;padding:12px;color:#c2d2e4;background:transparent;font-weight:700}
    .nav button.active,.nav button:hover{background:#11395f;color:#fff}.nav-spacer{flex:1}
    .side-foot{display:grid;gap:9px;border-top:1px solid rgba(255,255,255,.09);padding-top:16px}.side-foot button{color:#c2d2e4}
    .main{min-width:0}.topbar{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:20}
    .topbar h1{font-size:22px;margin:0}.topbar small{color:var(--muted)}.top-actions{display:flex;align-items:center;gap:10px}
    .content{padding:26px;max-width:1600px;margin:auto}
    .summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px}
    .summary{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 4px 15px rgba(19,42,76,.04)}
    .summary .label{font-size:13px;color:var(--muted);font-weight:700}.summary .value{font-size:30px;font-weight:900;margin-top:8px}.summary .detail{font-size:12px;color:var(--muted);margin-top:6px}
    .toolbar{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap}.toolbar-group{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .segmented{display:flex;padding:4px;background:#eaf0f7;border-radius:12px}.segmented button{border:0;background:transparent;padding:8px 12px;border-radius:9px;font-weight:800;color:#58687a}.segmented button.active{background:#fff;color:var(--primary);box-shadow:0 3px 10px rgba(19,42,76,.08)}
    .calendar-card{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 5px 18px rgba(19,42,76,.05)}
    .week-grid{display:grid;grid-template-columns:170px repeat(7,minmax(150px,1fr));overflow:auto}
    .week-head,.resource-name,.week-cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:118px}
    .week-head{min-height:auto;padding:13px;background:#f8fafc;text-align:center;position:sticky;top:76px;z-index:5}.week-head:first-child{text-align:left;left:0;z-index:8}
    .week-head strong{display:block;font-size:13px}.week-head span{font-size:12px;color:var(--muted)}.week-head.today{background:#eaf4ff;color:var(--primary)}
    .resource-name{padding:15px;position:sticky;left:0;background:#fff;z-index:4}.resource-name strong{display:block}.resource-name small{color:var(--muted)}
    .week-cell{padding:8px;background:#fff}.week-cell:hover{background:#fbfdff}
    .booking{border-left:4px solid var(--primary);background:#edf6ff;border-radius:10px;padding:8px;margin-bottom:7px;font-size:11px;line-height:1.35;cursor:pointer}
    .booking strong{display:block;font-size:12px}.booking .time{font-weight:800;color:var(--primary)}.booking.current{border-color:var(--success);background:var(--success-soft)}
    .month-grid{display:grid;grid-template-columns:repeat(7,1fr)}.month-weekday{background:#f8fafc;padding:12px;text-align:center;font-size:12px;font-weight:900;color:#667085;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
    .month-day{min-height:130px;padding:9px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#fff}.month-day.other{background:#fafbfc;color:#a0a9b5}.month-day.today{box-shadow:inset 0 0 0 2px #5c9dde}.day-number{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:900;margin-bottom:7px}.count-badge{font-size:10px;background:#e8f1fb;color:var(--primary);padding:3px 6px;border-radius:999px}
    .month-booking{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#eff6ff;border-radius:6px;padding:4px 5px;margin-bottom:4px;border-left:3px solid var(--primary)}
    .empty-state{padding:45px;text-align:center;color:var(--muted)}

    /* Config */
    .settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 5px 18px rgba(19,42,76,.04)}
    .panel h3{margin:0 0 5px}.panel .sub{color:var(--muted);font-size:13px;margin-bottom:20px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.form-grid .full{grid-column:1/-1}
    .resource-list,.user-list{display:grid;gap:8px}.resource-item,.user-item{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:12px;padding:11px 12px}.resource-item span,.user-item span{display:flex;align-items:center;gap:9px}
    .resource-dot{width:10px;height:10px;border-radius:50%;background:var(--primary)}

    /* Modal */
    .modal-backdrop{position:fixed;inset:0;background:rgba(5,18,33,.65);display:grid;place-items:center;padding:22px;z-index:100;backdrop-filter:blur(3px)}
    .modal{background:#fff;border-radius:20px;width:min(780px,100%);max-height:92vh;overflow:auto;box-shadow:0 25px 70px rgba(0,0,0,.3)}
    .modal-head{display:flex;align-items:center;justify-content:space-between;padding:20px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}.modal-head h2{font-size:21px;margin:0}.modal-body{padding:22px}.modal-foot{display:flex;justify-content:flex-end;gap:10px;border-top:1px solid var(--line);padding:16px 22px;position:sticky;bottom:0;background:#fff}
    .alert{border-radius:12px;padding:12px 13px;font-size:13px;margin-bottom:15px}.alert-error{background:#fff0f0;color:#9c2828;border:1px solid #ffd0d0}.alert-info{background:#edf6ff;color:#245c8c;border:1px solid #cce5fb}

    /* Painel público / modo TV */
    .public-page{min-height:100vh;background:radial-gradient(circle at 12% 0,#163f68 0,#071a30 46%,#03101e 100%);color:#fff;padding:26px 30px;display:flex;flex-direction:column}
    .public-header{display:flex;align-items:center;justify-content:space-between;gap:22px;padding:2px 2px 18px}.public-brand{display:flex;align-items:center;gap:16px}.public-brand .logo{width:62px;height:62px;border-radius:16px}.public-brand h1{margin:0;font-size:clamp(28px,2.25vw,44px);line-height:1.05;letter-spacing:-.025em}.public-brand p{margin:7px 0 0;color:#c1d2e2;font-size:clamp(14px,1vw,19px);font-weight:700}.public-clock{text-align:right;min-width:180px}.public-clock strong{font-size:clamp(42px,4vw,72px);line-height:.9;display:block;letter-spacing:-.04em}.public-clock span{display:block;color:#c1d2e2;font-size:clamp(14px,1.15vw,21px);font-weight:800;margin-top:8px}
    .public-toolbar{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.10)}.date-nav{display:flex;align-items:center;gap:10px}.date-nav button{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.20);color:#fff}.date-label{font-weight:950;font-size:clamp(20px,1.55vw,30px);min-width:310px;text-align:center;text-transform:capitalize}
    .public-grid{display:grid;grid-template-columns:repeat(4,minmax(250px,1fr));gap:18px;align-items:stretch;flex:1}.space-card{position:relative;background:#13283d;border:2px solid #354a5e;border-radius:22px;padding:21px 22px;min-height:315px;box-shadow:0 16px 36px rgba(0,0,0,.25);transition:.2s;overflow:hidden}.space-card:before{content:"";position:absolute;inset:0 auto 0 0;width:8px;background:#718397}.space-card.free{background:linear-gradient(155deg,#14283b,#0d1d2d);border-color:#40556a}.space-card.scheduled{background:linear-gradient(155deg,#123f67,#0a2b49);border-color:#54aff2;box-shadow:0 18px 44px rgba(0,91,168,.32),inset 0 0 0 1px rgba(115,194,255,.15)}.space-card.scheduled:before{background:#59b8ff}.space-card.in-use{background:linear-gradient(155deg,#0d5940,#073e2d);border-color:#61edaf;box-shadow:0 20px 48px rgba(0,138,88,.38),0 0 0 4px rgba(71,224,158,.12)}.space-card.in-use:before{background:#5cf0ad}.space-card.in-use:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;right:-90px;top:-90px;background:rgba(105,255,185,.10)}
    .space-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding-bottom:15px;border-bottom:1px solid rgba(255,255,255,.16);position:relative;z-index:1}.space-head h2{font-size:clamp(23px,1.65vw,33px);line-height:1.05;margin:0;font-weight:950;letter-spacing:-.02em}.space-head small{display:block;color:#ccdae7;font-size:clamp(12px,.8vw,16px);font-weight:700;margin-top:7px}.status-pill{font-size:clamp(12px,.75vw,15px);font-weight:950;border-radius:999px;padding:8px 12px;background:#34485b;white-space:nowrap;letter-spacing:.03em}.status-pill.free{color:#f2f6fa}.status-pill.scheduled{background:#117dcc;color:#fff;box-shadow:0 0 0 4px rgba(40,154,239,.18)}.status-pill.busy{background:#10a86b;color:#fff;box-shadow:0 0 0 5px rgba(46,215,145,.18)}
    .current-box{position:relative;z-index:1;margin:16px 0;padding:16px 17px;border-radius:16px;background:rgba(26,200,130,.17);border:1px solid rgba(95,239,177,.47)}.current-box.scheduled{background:rgba(31,144,228,.18);border-color:rgba(91,185,255,.48)}.current-box.empty{background:rgba(255,255,255,.055);border-color:rgba(255,255,255,.10)}
    .current-box .eyebrow{text-transform:uppercase;letter-spacing:.10em;font-size:clamp(11px,.7vw,14px);color:#8ff2c4;font-weight:950}.current-box.scheduled .eyebrow{color:#9ed5ff}.current-box.empty .eyebrow{color:#c0cfdd}.current-box strong{display:block;font-size:clamp(21px,1.45vw,29px);line-height:1.12;margin-top:7px;font-weight:950}.current-box span{display:block;color:#e5eef6;font-size:clamp(14px,.95vw,19px);line-height:1.25;margin-top:7px;font-weight:700}
    .status-legend{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.legend-item{display:inline-flex;align-items:center;gap:8px;padding:8px 11px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.07);border-radius:999px;font-size:clamp(12px,.7vw,15px);font-weight:900;color:#eef4f9}.legend-dot{width:11px;height:11px;border-radius:50%;background:#8394a5}.legend-item.scheduled .legend-dot{background:#59b8ff;box-shadow:0 0 0 4px rgba(82,173,244,.13)}.legend-item.busy .legend-dot{background:#5cf0ad;box-shadow:0 0 0 4px rgba(66,225,157,.13)}
    .schedule-list{display:grid;gap:9px}.schedule-row{display:grid;grid-template-columns:minmax(108px,.38fr) 1fr;gap:12px;align-items:center;font-size:clamp(14px,.88vw,18px);padding:5px 0}.schedule-row .slot{font-weight:950;color:#9ed5ff;white-space:nowrap}.schedule-row .who{min-width:0;color:#f2f6fa;line-height:1.15}.schedule-row .who strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:1.04em}.schedule-row .who small{display:block;color:#bed0df;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px;font-size:.82em}.schedule-row.now{background:rgba(55,221,150,.10);border-radius:10px;padding:7px 8px}.schedule-row.now .slot,.schedule-row.now .who strong{color:#75f0bc}
    .public-foot{display:flex;justify-content:space-between;gap:16px;color:#b5c6d5;font-size:clamp(12px,.72vw,15px);font-weight:700;padding:16px 4px 0}.sync-note{display:inline-flex;align-items:center;gap:7px}.sync-note:before{content:"";width:8px;height:8px;border-radius:50%;background:#64e5a9;box-shadow:0 0 0 4px rgba(100,229,169,.12)}.sync-note.offline:before{background:#f2b94b}.fullscreen-btn{background:rgba(255,255,255,.10);color:#fff;border:1px solid rgba(255,255,255,.20);font-weight:850}
    .sync-badge{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:7px 10px;background:#edf7f2;color:#187853;font-size:12px;font-weight:850;border:1px solid #c8eadb}.sync-badge.warn{background:#fff7e8;color:#8a5a00;border-color:#f1d9a7}.sync-badge.error{background:#fff0f0;color:#a02d2d;border-color:#f0c7c7}

    .toast{position:fixed;right:22px;bottom:22px;background:#12283f;color:#fff;padding:13px 16px;border-radius:12px;box-shadow:var(--shadow);z-index:200;animation:slide .25s ease}
    @keyframes slide{from{transform:translateY(15px);opacity:0}to{transform:none;opacity:1}}

    @media(max-width:1100px){.login-page{grid-template-columns:1fr}.login-brand{display:none}.shell{grid-template-columns:82px 1fr}.side-brand div,.nav button span,.side-foot span{display:none}.side-brand{justify-content:center}.nav button{justify-content:center}.summary-grid{grid-template-columns:repeat(2,1fr)}.public-grid{grid-template-columns:repeat(2,1fr)}.settings-grid{grid-template-columns:1fr}}
    @media(max-height:850px) and (min-width:1200px){.public-page{padding:14px 20px}.public-header{padding-bottom:10px}.public-brand .logo{width:48px;height:48px}.public-toolbar{margin-bottom:10px;padding:8px 10px}.space-card{min-height:245px;padding:14px 16px}.current-box{margin:10px 0;padding:10px 12px}.schedule-list{gap:4px}.schedule-row{padding:2px 0}.public-foot{padding-top:8px}}
    @media(max-width:700px){.content{padding:16px}.topbar{padding:0 15px}.topbar small{display:none}.summary-grid{grid-template-columns:1fr 1fr;gap:10px}.summary{padding:14px}.summary .value{font-size:24px}.shell{grid-template-columns:1fr}.sidebar{position:fixed;height:auto;bottom:0;top:auto;left:0;right:0;z-index:50;display:block;padding:7px;background:#071a2e}.side-brand,.side-foot{display:none}.nav{display:flex;margin:0;justify-content:space-around}.nav button{padding:10px}.main{padding-bottom:68px}.public-page{padding:12px}.public-grid{grid-template-columns:1fr}.public-header{align-items:flex-start}.public-clock strong{font-size:23px}.public-brand h1{font-size:20px}.form-grid{grid-template-columns:1fr}.form-grid .full{grid-column:auto}.month-day{min-height:100px}.month-booking{display:none}}
  </style>
</head>
<body>
<div id="app" class="app"></div>

<div id="bookingModal" class="modal-backdrop hidden">
  <div class="modal">
    <div class="modal-head"><h2 id="modalTitle">Novo agendamento</h2><button class="icon-btn" onclick="closeBookingModal()">✕</button></div>
    <form id="bookingForm" onsubmit="saveBooking(event)">
      <div class="modal-body">
        <div id="bookingAlert" class="alert alert-error hidden"></div>
        <input type="hidden" id="bookingId" />
        <div class="form-grid">
          <div class="field"><label>Espaço *</label><select id="resourceId" required onchange="toggleCustomSpace()"></select></div>
          <div class="field hidden" id="customSpaceField"><label>Informe o espaço *</label><input id="customSpaceName" placeholder="Ex.: Sala 12, Biblioteca, Hall, Sala de Reuniões..." /></div>
          <div class="field"><label>Responsável / professor *</label><input id="responsible" required placeholder="Ex.: Prof. Leandro Pickler" /></div>
          <div class="field"><label>Turma, disciplina ou evento</label><input id="purpose" placeholder="Ex.: ADS — Redes de Computadores" /></div>
          <div class="field"><label>Tipo de horário</label><select id="periodType" onchange="applyPeriodPreset()"><option value="morning">Manhã — 08:00 às 11:10</option><option value="afternoon">Tarde — 13:00 às 17:00</option><option value="evening">Noite — 19:00 às 22:00</option><option value="morning1">Manhã 1 — 08:00 às 09:30</option><option value="morning2">Manhã 2 — 09:40 às 11:10</option><option value="afternoon1">Tarde 1 — 13:00 às 15:00</option><option value="afternoon2">Tarde 2 — 15:00 às 17:00</option><option value="evening1">Noite 1 — 19:00 às 20:30</option><option value="evening2">Noite 2 — 20:30 às 22:00</option><option value="custom">Meio período / horário personalizado</option></select></div>
          <div class="field"><label>Data inicial *</label><input type="date" id="startDate" required /></div>
          <div class="field"><label>Data final *</label><input type="date" id="endDate" required /></div>
          <div class="field"><label>Horário inicial *</label><input type="time" id="startTime" required value="08:00" /></div>
          <div class="field"><label>Horário final *</label><input type="time" id="endTime" required value="11:10" /></div>
          <div class="field"><label>Repetição</label><select id="repeat"><option value="none">Somente nesta data</option><option value="weekly">Toda semana</option><option value="weekdays">Todos os dias úteis</option></select></div>
          <div class="field"><label>Status</label><select id="status"><option value="confirmed">Confirmado</option><option value="pending">Pendente</option></select></div>
          <div class="field full"><label>Observações</label><textarea id="notes" rows="3" placeholder="Equipamentos, montagem, necessidades específicas..."></textarea></div>
        </div>
        <div class="alert alert-info">O sistema impede sobreposição no mesmo espaço e permite agendar um único dia, vários dias úteis ou repetições semanais.</div>
      </div>

<script>

  {id:'lab1',name:'Laboratório 01',type:'Sala 34 · 34 computadores',active:true},

function localISO(d){const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)}
function addDays(date,n){const d=new Date(date);d.setDate(d.getDate()+n);return d}

function normalizeSpaceName(name=''){return String(name).trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,70)||'espaco'}

function migrateStateData(data){const d=data||{};const oldVolante=(Array.isArray(d.resources)?d.resources:[]).find(r=>r.id==='volante');d.resources=(Array.isArray(d.resources)?d.resources:structuredClone(defaultResources)).filter(r=>r.id!=='volante');d.bookings=(Array.isArray(d.bookings)?d.bookings:[]).map(b=>{if(b.resourceId==='volante'){const name=(b.customSpaceName||oldVolante?.name||'Sala Volante').trim();return {...b,resourceId:makeCustomResourceId(name),customSpaceName:name}}return b});return d}
function loadState(){try{const saved=migrateStateData(JSON.parse(localStorage.getItem(DB_KEY)));return saved?{...defaultState(),...saved,settings:{...defaultState().settings,...(saved.settings||{}),github:{...defaultState().settings.github,...(saved.settings?.github||{})}},resources:Array.isArray(saved.resources)&&saved.resources.length?saved.resources.filter(r=>r.id!=='volante'):structuredClone(defaultResources),bookings:Array.isArray(saved.bookings)?saved.bookings:[],users:Array.isArray(saved.users)&&saved.users.length?saved.users:defaultState().users}:defaultState()}catch{return defaultState()}}
function saveState(){localStorage.setItem(DB_KEY,JSON.stringify(state));}
function githubToken(){return localStorage.getItem(GH_TOKEN_KEY)||''}

let syncInfo={status:'idle',last:null,message:'Aguardando sincronização'};

function getWeekStart(d){const x=new Date(d);const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);x.setHours(12,0,0,0);return x}

function bookingResourceName(b){if(!b)return 'Espaço';if(String(b.resourceId||'').startsWith('custom:'))return b.customSpaceName||'Outro espaço';return state.resources.find(x=>x.id===b.resourceId)?.name||b.customSpaceName||'Espaço'}
function bookingResourceType(b){if(String(b?.resourceId||'').startsWith('custom:'))return 'Espaço informado manualmente';return state.resources.find(x=>x.id===b?.resourceId)?.type||'Espaço institucional'}
function customResourcesForDates(dates){const set=new Map();const wanted=new Set(dates.map(localISO));state.bookings.filter(b=>wanted.has(b.date)&&String(b.resourceId||'').startsWith('custom:')).forEach(b=>set.set(b.resourceId,{id:b.resourceId,name:b.customSpaceName||'Outro espaço',type:'Espaço informado manualmente',active:true,custom:true}));return [...set.values()].sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'))}
function resourcesForPublicDate(date){return [...state.resources.filter(r=>r.active),...customResourcesForDates([date])]}
function resourcesForWeek(days){return [...state.resources.filter(r=>r.active),...customResourcesForDates(days)]}
function currentStatus(b,date=new Date()){const today=localISO(date);const hm=date.toTimeString().slice(0,5);return b.date===today&&b.startTime<=hm&&b.endTime>hm}
function renderAgenda(){
 const today=localISO(new Date());const confirmed=state.bookings.filter(b=>b.status==='confirmed').length;const todayCount=state.bookings.filter(b=>b.date===today).length;const occupiedNow=new Set(state.bookings.filter(b=>b.status==='confirmed'&&currentStatus(b)).map(b=>b.resourceId)).size;
 document.getElementById('adminContent').innerHTML=`<div class="summary-grid"><div class="summary"><div class="label">Espaços fixos</div><div class="value">${state.resources.filter(r=>r.active).length}</div><div class="detail">5 laboratórios + auditório · outros sob demanda</div></div><div class="summary"><div class="label">Agendamentos hoje</div><div class="value">${todayCount}</div><div class="detail">Somando todos os turnos</div></div><div class="summary"><div class="label">Em uso agora</div><div class="value">${occupiedNow}</div><div class="detail">Inclui espaços informados manualmente</div></div><div class="summary"><div class="label">Confirmados</div><div class="value">${confirmed}</div><div class="detail">Base sincronizada</div></div></div>
 <div class="toolbar"><div class="toolbar-group"><button class="icon-btn" onclick="moveCalendar(-1)">‹</button><button class="btn btn-secondary" onclick="goToday()">Hoje</button><button class="icon-btn" onclick="moveCalendar(1)">›</button><strong id="rangeTitle"></strong></div><div class="toolbar-group"><div class="segmented"><button class="${currentView==='week'?'active':''}" onclick="changeView('week')">Semana</button><button class="${currentView==='month'?'active':''}" onclick="changeView('month')">Mês</button></div><button class="btn btn-secondary" onclick="exportJson()">⇩ Exportar JSON</button></div></div><div id="calendarHost" class="calendar-card"></div>`;
 renderCalendar();
}
function changeView(v){currentView=v;renderAgenda()}
function moveCalendar(n){if(currentView==='week')referenceDate=addDays(referenceDate,n*7);else referenceDate=new Date(referenceDate.getFullYear(),referenceDate.getMonth()+n,1);renderAgenda()}
function goToday(){referenceDate=new Date();renderAgenda()}
function renderCalendar(){currentView==='week'?renderWeek():renderMonth()}
function renderWeek(){
 const start=getWeekStart(referenceDate);const days=Array.from({length:7},(_,i)=>addDays(start,i));
 document.getElementById('rangeTitle').textContent=`${formatDate(start,{day:'2-digit',month:'short'})} — ${formatDate(days[6],{day:'2-digit',month:'short',year:'numeric'})}`;
 let html=`<div class="week-grid"><div class="week-head"><strong>Espaço</strong><span>Agenda semanal</span></div>`;
 days.forEach(d=>html+=`<div class="week-head ${localISO(d)===localISO(new Date())?'today':''}"><strong>${formatDate(d,{weekday:'short'})}</strong><span>${formatDate(d,{day:'2-digit',month:'2-digit'})}</span></div>`);
 resourcesForWeek(days).forEach(r=>{html+=`<div class="resource-name"><strong>${escapeHtml(r.name)}</strong><small>${escapeHtml(r.type)}</small></div>`;days.forEach(d=>{const arr=getBookings(d,r.id);html+=`<div class="week-cell" ondblclick="openBookingModal('', '${localISO(d)}', '${r.id}')">${arr.map(b=>`<div class="booking ${currentStatus(b)?'current':''}" onclick="openBookingModal('${b.id}')"><span class="time">${periodLabel(b)}</span><strong>${escapeHtml(b.responsible)}</strong><span>${escapeHtml(b.purpose||'Reserva')}</span></div>`).join('')}</div>`});});
 html+='</div>';document.getElementById('calendarHost').innerHTML=html;
}
function renderMonth(){
 const first=new Date(referenceDate.getFullYear(),referenceDate.getMonth(),1,12);const offset=(first.getDay()+6)%7;const start=addDays(first,-offset);document.getElementById('rangeTitle').textContent=formatDate(first,{month:'long',year:'numeric'});
 let html='<div class="month-grid">';['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].forEach(x=>html+=`<div class="month-weekday">${x}</div>`);
 for(let i=0;i<42;i++){const d=addDays(start,i),arr=getBookings(d);const other=d.getMonth()!==first.getMonth();html+=`<div class="month-day ${other?'other':''} ${localISO(d)===localISO(new Date())?'today':''}" ondblclick="openBookingModal('', '${localISO(d)}')"><div class="day-number"><span>${d.getDate()}</span>${arr.length?`<span class="count-badge">${arr.length}</span>`:''}</div>${arr.slice(0,4).map(b=>{const r=state.resources.find(x=>x.id===b.resourceId);return `<div class="month-booking" onclick="openBookingModal('${b.id}')">${b.startTime} · ${escapeHtml(bookingResourceName(b))} · ${escapeHtml(b.purpose)}</div>`}).join('')}${arr.length>4?`<small>+ ${arr.length-4} agendamento(s)</small>`:''}</div>`}
 html+='</div>';document.getElementById('calendarHost').innerHTML=html;
}
function renderBookingList(){
 const sorted=[...state.bookings].sort((a,b)=>(a.date+a.startTime).localeCompare(b.date+b.startTime));
 document.getElementById('adminContent').innerHTML=`<div class="panel"><div class="toolbar"><div><h3 style="margin:0">Todos os agendamentos</h3><div class="sub" style="margin:5px 0 0">Clique em um item para editar ou excluir.</div></div><button class="btn btn-secondary" onclick="exportJson()">Exportar JSON</button></div><div class="resource-list">${sorted.map(b=>{const r=state.resources.find(x=>x.id===b.resourceId);return `<div class="resource-item" onclick="openBookingModal('${b.id}')" style="cursor:pointer"><span><span class="resource-dot"></span><span><strong>${escapeHtml(bookingResourceName(b))}</strong><br><small>${formatDate(parseLocal(b.date),{day:'2-digit',month:'2-digit',year:'numeric'})} · ${periodLabel(b)} · ${escapeHtml(b.purpose)} — ${escapeHtml(b.responsible)}</small></span></span><span class="tag ${b.status==='confirmed'?'tag-green':'tag-orange'}">${b.status==='confirmed'?'Confirmado':'Pendente'}</span></div>`}).join('')||'<div class="empty-state">Nenhum agendamento cadastrado.</div>'}</div></div>`;
}
function renderSettings(){
 const gh=state.settings.github||{};
 document.getElementById('adminContent').innerHTML=`<div class="settings-grid"><section class="panel"><h3>Identidade do sistema</h3><div class="sub">Altere o nome, o título do painel e a logomarca.</div><div class="field"><label>Nome do sistema</label><input id="cfgAppName" value="${escapeHtml(state.settings.appName)}"></div><div class="field"><label>Título do painel público</label><input id="cfgPanelTitle" value="${escapeHtml(state.settings.panelTitle)}"></div><div class="field"><label>Logomarca</label><input type="file" accept="image/*" onchange="loadLogo(event)"></div><div class="field"><label>Atualização do painel (segundos)</label><input id="cfgRefresh" type="number" min="30" max="600" value="${Number(state.settings.publicRefreshSeconds)||60}"></div><button class="btn btn-primary" onclick="saveSettings()">Salvar configurações</button></section>
 <section class="panel"><h3>Integração com GitHub</h3><div class="sub">O token fica somente neste navegador e nunca é gravado no JSON público.</div><div class="form-grid"><div class="field"><label>Proprietário</label><input id="ghOwner" value="${escapeHtml(gh.owner||'')}" placeholder="TI-FMPSC"></div><div class="field"><label>Repositório</label><input id="ghRepo" value="${escapeHtml(gh.repo||'')}" placeholder="agenda-fmp"></div><div class="field"><label>Branch</label><input id="ghBranch" value="${escapeHtml(gh.branch||'main')}" placeholder="main"></div><div class="field"><label>Caminho do JSON</label><input id="ghPath" value="${escapeHtml(gh.path||'dados/agendamentos.json')}"></div><div class="field full"><label>Fine-grained token</label><input id="ghToken" type="password" value="${escapeHtml(githubToken())}" placeholder="github_pat_..."></div></div><div style="display:flex;gap:9px;flex-wrap:wrap"><button class="btn btn-primary" onclick="saveGithub()">Salvar conexão</button><button class="btn btn-secondary" onclick="testGithubConnection()">Testar conexão</button><button class="btn btn-secondary" onclick="syncFromGithub()">Baixar JSON do GitHub</button></div><div class="alert alert-info" style="margin-top:14px;margin-bottom:0">Permissão necessária no token: <b>Contents = Read and write</b>, limitada ao repositório desta agenda.</div></section>
 <section class="panel"><h3>Espaços cadastrados</h3><div class="sub">Os cinco laboratórios e o auditório são fixos. Outros espaços são informados diretamente no novo agendamento.</div><div class="resource-list">${state.resources.map(r=>`<div class="resource-item"><span><span class="resource-dot"></span><span><strong>${escapeHtml(r.name)}</strong><br><small>${escapeHtml(r.type)}</small></span></span><span class="tag tag-blue">Ativo</span></div>`).join('')}</div></section>
 <section class="panel"><h3>Usuários e backup</h3><div class="sub">O login desta versão é local ao navegador. O token do GitHub é a credencial que autoriza gravação no repositório.</div><div class="user-list">${state.users.map(u=>`<div class="user-item"><span><span class="resource-dot" style="background:var(--success)"></span><span><strong>${escapeHtml(u.name)}</strong><br><small>${escapeHtml(u.username)} · ${escapeHtml(u.role)}</small></span></span><span class="tag tag-green">Ativo</span></div>`).join('')}</div><div style="display:flex;gap:9px;margin-top:16px;flex-wrap:wrap"><button class="btn btn-secondary" onclick="document.getElementById('importInput').click()">Importar JSON</button><button class="btn btn-secondary" onclick="exportJson()">Exportar JSON</button><button class="btn btn-danger" onclick="resetDemo()">Limpar dados locais</button></div></section></div>`;
}
let pendingLogo=null;

function loadLogo(e){const f=e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{pendingLogo=reader.result;toast('Logo carregada. Clique em salvar configurações.')} ;reader.readAsDataURL(f)}
function saveSettings(){state.settings.appName=document.getElementById('cfgAppName').value.trim()||'Agenda de Espaços FMP';state.settings.panelTitle=document.getElementById('cfgPanelTitle').value.trim()||'Painel de Laboratórios e Espaços';if(pendingLogo){state.settings.logo=pendingLogo;pendingLogo=null}saveState();renderAdmin();toast('Configurações salvas.')}
async function saveGithub(){state.settings.github={owner:document.getElementById('ghOwner').value.trim(),repo:document.getElementById('ghRepo').value.trim(),branch:document.getElementById('ghBranch').value.trim()||'main',path:document.getElementById('ghPath').value.trim()||'dados/agendamentos.json'};localStorage.setItem(GH_TOKEN_KEY,document.getElementById('ghToken').value.trim());saveState();toast('Conexão salva somente neste navegador.');await testGithubConnection();}
function openBookingModal(id='',presetDate='',presetResource=''){
 const b=id?state.bookings.find(x=>x.id===id):null;document.getElementById('modalTitle').textContent=b?'Editar agendamento':'Novo agendamento';document.getElementById('bookingId').value=b?.id||'';
 document.getElementById('resourceId').innerHTML=state.resources.filter(r=>r.active&&r.id!=='volante').map(r=>`<option value="${r.id}">${escapeHtml(r.name)}</option>`).join('')+'<option value="__custom__">Outro espaço — digitar nome</option>';
 const selected=b?.resourceId||presetResource||state.resources.find(r=>r.active)?.id||'__custom__';const isCustom=String(selected).startsWith('custom:');document.getElementById('resourceId').value=isCustom?'__custom__':selected;document.getElementById('customSpaceName').value=isCustom?(b?.customSpaceName||(presetResource?state.bookings.find(x=>x.resourceId===presetResource)?.customSpaceName:'')||''):'';toggleCustomSpace();
 document.getElementById('responsible').value=b?.responsible||'';document.getElementById('purpose').value=b?.purpose||'';
 document.getElementById('startDate').value=b?.date||presetDate||localISO(new Date());document.getElementById('endDate').value=b?.date||presetDate||localISO(new Date());document.getElementById('startTime').value=b?.startTime||'08:00';document.getElementById('endTime').value=b?.endTime||'11:10';document.getElementById('repeat').value='none';document.getElementById('repeat').disabled=!!b;document.getElementById('status').value=b?.status||'confirmed';document.getElementById('notes').value=b?.notes||'';
 const preset=!b?'morning':b.startTime==='08:00'&&b.endTime==='11:10'?'morning':b.startTime==='13:00'&&b.endTime==='17:00'?'afternoon':b.startTime==='19:00'&&b.endTime==='22:00'?'evening':b.startTime==='08:00'&&b.endTime==='09:30'?'morning1':b.startTime==='09:40'&&b.endTime==='11:10'?'morning2':b.startTime==='13:00'&&b.endTime==='15:00'?'afternoon1':b.startTime==='15:00'&&b.endTime==='17:00'?'afternoon2':b.startTime==='19:00'&&b.endTime==='20:30'?'evening1':b.startTime==='20:30'&&b.endTime==='22:00'?'evening2':'custom';document.getElementById('periodType').value=b?preset:'morning';document.getElementById('bookingAlert').classList.add('hidden');
 let foot=document.querySelector('#bookingModal .modal-foot');const old=document.getElementById('deleteBtn');if(old)old.remove();if(b){const del=document.createElement('button');del.type='button';del.id='deleteBtn';del.className='btn btn-danger';del.textContent='Excluir';del.onclick=()=>deleteBooking(b.id);foot.prepend(del)}

function toggleCustomSpace(){const sel=document.getElementById('resourceId'),field=document.getElementById('customSpaceField'),input=document.getElementById('customSpaceName');if(!sel||!field||!input)return;const custom=sel.value==='__custom__';field.classList.toggle('hidden',!custom);input.required=custom;if(custom)setTimeout(()=>input.focus(),0)}

function applyPeriodPreset(){const type=document.getElementById('periodType').value;const map={morning:['08:00','11:10'],afternoon:['13:00','17:00'],evening:['19:00','22:00'],morning1:['08:00','09:30'],morning2:['09:40','11:10'],afternoon1:['13:00','15:00'],afternoon2:['15:00','17:00'],evening1:['19:00','20:30'],evening2:['20:30','22:00']};if(map[type]){document.getElementById('startTime').value=map[type][0];document.getElementById('endTime').value=map[type][1]}}
function datesBetween(start,end,repeat){let out=[];let d=parseLocal(start),last=parseLocal(end);if(repeat==='none')return [start];while(d<=last){if(repeat==='weekdays'){if(d.getDay()!==0&&d.getDay()!==6)out.push(localISO(d));d=addDays(d,1)}else{out.push(localISO(d));d=addDays(d,7)}}return out}
function overlaps(aStart,aEnd,bStart,bEnd){return aStart<bEnd&&aEnd>bStart}
async function saveBooking(e){
 e.preventDefault();const id=document.getElementById('bookingId').value;const selectedResource=document.getElementById('resourceId').value;const customSpaceName=document.getElementById('customSpaceName').value.trim();const resourceId=selectedResource==='__custom__'?makeCustomResourceId(customSpaceName):selectedResource;const startDate=document.getElementById('startDate').value,endDate=document.getElementById('endDate').value,startTime=document.getElementById('startTime').value,endTime=document.getElementById('endTime').value,repeat=document.getElementById('repeat').value;
 const alert=document.getElementById('bookingAlert');if(selectedResource==='__custom__'&&!customSpaceName){alert.textContent='Informe o nome do espaço que será utilizado.';alert.classList.remove('hidden');return}if(endDate<startDate||endTime<=startTime){alert.textContent='Verifique as datas e os horários informados.';alert.classList.remove('hidden');return}
 const dates=datesBetween(startDate,endDate,repeat);const conflicts=dates.filter(date=>state.bookings.some(b=>b.id!==id&&b.resourceId===resourceId&&b.date===date&&b.status!=='cancelled'&&overlaps(startTime,endTime,b.startTime,b.endTime)));
 if(conflicts.length){alert.textContent=`Conflito encontrado em ${conflicts.slice(0,3).map(x=>formatDate(parseLocal(x),{day:'2-digit',month:'2-digit'})).join(', ')}. O espaço já possui agendamento nesse horário.`;alert.classList.remove('hidden');return}
 const base={resourceId,...(selectedResource==='__custom__'?{customSpaceName}:{}),responsible:document.getElementById('responsible').value.trim(),purpose:document.getElementById('purpose').value.trim(),startTime,endTime,status:document.getElementById('status').value,notes:document.getElementById('notes').value.trim()};
 if(id){const idx=state.bookings.findIndex(b=>b.id===id);const previous=state.bookings[idx]||{};state.bookings[idx]={...previous,...base,date:startDate};if(selectedResource!=='__custom__')delete state.bookings[idx].customSpaceName}else dates.forEach(date=>state.bookings.push({id:crypto.randomUUID(),...base,date}));
 closeBookingModal();renderAdmin();await persistAndSync(id?'Atualiza agendamento':'Cria agendamento');
}
async function deleteBooking(id){if(!confirm('Deseja excluir este agendamento?'))return;state.bookings=state.bookings.filter(b=>b.id!==id);closeBookingModal();renderAdmin();await persistAndSync('Exclui agendamento');}
function exportJson(){const data=sharedPayload();const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='agendamentos.json';a.click();URL.revokeObjectURL(a.href)}
function importJson(e){const f=e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{try{const d=JSON.parse(reader.result);mergeRemoteData(d);renderAdmin();toast('JSON importado com sucesso. Use uma alteração para publicá-lo no GitHub.')}catch(err){toast('Arquivo JSON inválido: '+err.message)}};reader.readAsText(f);e.target.value=''}
function resetDemo(){if(!confirm('Limpar dados locais deste navegador? O JSON do GitHub não será apagado.'))return;const token=githubToken();state=defaultState();saveState();if(token)localStorage.setItem(GH_TOKEN_KEY,token);renderAdmin();toast('Dados locais limpos. Use Sincronizar para baixar o GitHub novamente.')}
function sharedPayload(){
 const {github,...publicSettings}=state.settings||{};
 return {version:3,updatedAt:new Date().toISOString(),settings:publicSettings,resources:state.resources.filter(r=>r.id!=='volante'),bookings:[...state.bookings].sort((a,b)=>(a.date+a.startTime).localeCompare(b.date+b.startTime))};
}
function githubApiUrl(){const g=state.settings.github||{};return `https://api.github.com/repos/${encodeURIComponent(g.owner||'')}/${encodeURIComponent(g.repo||'')}/contents/${String(g.path||'dados/agendamentos.json').split('/').map(encodeURIComponent).join('/')}?ref=${encodeURIComponent(g.branch||'main')}`}
function githubRawUrl(){const g=state.settings.github||{};return `https://raw.githubusercontent.com/${encodeURIComponent(g.owner||'')}/${encodeURIComponent(g.repo||'')}/${encodeURIComponent(g.branch||'main')}/${String(g.path||'dados/agendamentos.json').split('/').map(encodeURIComponent).join('/')}?t=${Date.now()}`}
function decodeBase64Unicode(b64){const bytes=Uint8Array.from(atob(String(b64).replace(/\s/g,'')),c=>c.charCodeAt(0));return new TextDecoder().decode(bytes)}
function encodeBase64Unicode(text){const bytes=new TextEncoder().encode(text);let binary='';for(const b of bytes)binary+=String.fromCharCode(b);return btoa(binary)}
function mergeRemoteData(d){if(!d||!Array.isArray(d.resources)||!Array.isArray(d.bookings))throw new Error('JSON do GitHub possui estrutura inválida.');d=migrateStateData(d);state.resources=d.resources.filter(r=>r.id!=='volante');state.bookings=d.bookings;state.settings={...state.settings,...(d.settings||{}),github:state.settings.github};state.meta={...(state.meta||{}),updatedAt:d.updatedAt||new Date().toISOString()};saveState();syncInfo={status:'ok',last:new Date(),message:'Sincronizado com GitHub'};}
async function fetchGithubJson(useToken=false){
 const g=state.settings.github||{};if(!g.owner||!g.repo)throw new Error('Informe proprietário e repositório nas configurações.');
 const headers={'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};const token=githubToken();if(useToken&&token)headers.Authorization=`Bearer ${token}`;
 const res=await fetch(githubApiUrl(),{headers,cache:'no-store'});if(!res.ok){const t=await res.text();throw new Error(`GitHub ${res.status}: ${t.slice(0,180)}`)}const file=await res.json();return {data:JSON.parse(decodeBase64Unicode(file.content)),sha:file.sha};
}
async function fetchPublicJson(){
 const urls=[githubRawUrl(),`./${state.settings.github?.path||'dados/agendamentos.json'}?t=${Date.now()}`];let lastErr;
 for(const url of urls){try{const res=await fetch(url,{cache:'no-store'});if(!res.ok)throw new Error(`HTTP ${res.status}`);return await res.json()}catch(e){lastErr=e}}
 throw lastErr||new Error('Não foi possível carregar o JSON público.');
}
async function syncFromGithub(silent=false){
 try{syncInfo={status:'busy',last:syncInfo.last,message:'Sincronizando...'};updateAdminSyncBadge();const {data}=await fetchGithubJson(Boolean(githubToken()));mergeRemoteData(data);if(!silent)toast('Dados atualizados a partir do GitHub.');if(location.hash==='#admin')renderAdmin();return true}catch(e){syncInfo={status:'error',last:syncInfo.last,message:e.message};updateAdminSyncBadge();if(!silent)toast('Falha ao sincronizar: '+e.message);return false}
}
async function syncPublic(silent=true){
 try{const d=await fetchPublicJson();mergeRemoteData(d);if(location.hash==='#painel')renderPublic(false);return true}catch(e){syncInfo={status:'error',last:syncInfo.last,message:e.message};if(!silent)toast('Não foi possível atualizar o painel.');updatePublicSyncNote();return false}
}
async function saveDataToGithub(message='Atualiza Agenda FMP'){
 const token=githubToken();if(!token)throw new Error('Token do GitHub não configurado neste navegador.');const g=state.settings.github||{};if(!g.owner||!g.repo)throw new Error('Configure o repositório do GitHub.');
 let sha=null;try{const current=await fetchGithubJson(true);sha=current.sha}catch(e){if(!String(e.message).includes('GitHub 404'))throw e}
 const body={message,content:encodeBase64Unicode(JSON.stringify(sharedPayload(),null,2)),branch:g.branch||'main'};if(sha)body.sha=sha;
 const headers={'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28','Authorization':`Bearer ${token}`};
 const url=githubApiUrl().split('?ref=')[0];const res=await fetch(url,{method:'PUT',headers,body:JSON.stringify(body)});if(!res.ok){const txt=await res.text();throw new Error(`GitHub ${res.status}: ${txt.slice(0,220)}`)}syncInfo={status:'ok',last:new Date(),message:'Publicado no GitHub'};state.meta={...(state.meta||{}),updatedAt:new Date().toISOString()};saveState();return true;
}
async function persistAndSync(message){
 saveState();syncInfo={status:'busy',last:syncInfo.last,message:'Publicando...'};updateAdminSyncBadge();try{await saveDataToGithub(message);toast('Salvo e publicado no GitHub.')}catch(e){syncInfo={status:'error',last:syncInfo.last,message:e.message};toast('Salvo neste navegador, mas não publicado: '+e.message)}updateAdminSyncBadge();
}
async function testGithubConnection(){
 try{const {data}=await fetchGithubJson(Boolean(githubToken()));if(!Array.isArray(data.bookings))throw new Error('JSON encontrado, mas estrutura é inválida.');syncInfo={status:'ok',last:new Date(),message:githubToken()?'Conexão e token válidos':'Leitura pública funcionando'};updateAdminSyncBadge();toast(githubToken()?'Conexão com GitHub funcionando.':'Leitura funcionando. Configure um token para gravar.')}catch(e){syncInfo={status:'error',last:syncInfo.last,message:e.message};updateAdminSyncBadge();toast('Erro na conexão: '+e.message)}
}
function updateAdminSyncBadge(){const el=document.getElementById('adminSyncBadge');if(!el)return;el.className='sync-badge '+(syncInfo.status==='error'?'error':syncInfo.status==='busy'?'warn':'');el.textContent=syncInfo.status==='busy'?'Sincronizando...':syncInfo.status==='error'?'GitHub com erro':syncInfo.last?'GitHub sincronizado':'GitHub';el.title=syncInfo.message||''}
function updatePublicSyncNote(){const el=document.getElementById('publicSync');if(!el)return;const ok=syncInfo.status!=='error';el.className='sync-note'+(ok?'':' offline');el.textContent=ok?`Dados atualizados${syncInfo.last?' às '+syncInfo.last.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):''}`:'Exibindo última atualização disponível'}
function renderPublic(resetTimer=true){
 const selected=window.publicDate||new Date();window.publicDate=selected;document.getElementById('app').innerHTML=`<section class="public-page"><header class="public-header"><div class="public-brand">${logoMarkup()}<div><h1>${escapeHtml(state.settings.panelTitle)}</h1><p>${escapeHtml(state.settings.appName)} · Agenda pública</p></div></div><div class="public-clock"><strong id="clock">--:--</strong><span id="clockDate"></span></div></header>
 <div class="public-toolbar"><div class="date-nav"><button class="icon-btn" onclick="movePublicDate(-1)">‹</button><button class="btn fullscreen-btn" onclick="window.publicDate=new Date();renderPublic()">Hoje</button><button class="icon-btn" onclick="movePublicDate(1)">›</button><div class="date-label">${formatDate(selected,{weekday:'long',day:'2-digit',month:'long'})}</div></div><div class="status-legend"><span class="legend-item busy"><span class="legend-dot"></span>EM USO</span><span class="legend-item scheduled"><span class="legend-dot"></span>AGENDADO</span><span class="legend-item"><span class="legend-dot"></span>LIVRE</span></div><div style="display:flex;gap:9px"><button class="btn fullscreen-btn" onclick="toggleFullscreen()">⛶ Tela cheia</button><button class="btn fullscreen-btn" onclick="location.hash='${isLogged()?'#admin':'#login'}'">Administração</button></div></div>
 <div class="public-grid">${resourcesForPublicDate(selected).map(r=>publicSpaceCard(r,selected)).join('')}</div><footer class="public-foot"><span>Turnos: 08:00–11:10 · 13:00–17:00 · 19:00–22:00</span><span id="publicSync" class="sync-note">Dados carregados</span></footer></section>`;updateClock();updatePublicSyncNote();if(resetTimer){clearInterval(window.publicTimer);const seconds=Math.max(30,Number(state.settings.publicRefreshSeconds)||60);window.publicTimer=setInterval(async()=>{updateClock();if(localISO(window.publicDate)===localISO(new Date()))await syncPublic(true)},seconds*1000)}
}
function displayPurpose(b){return (b.purpose||'').trim()||'Reserva de espaço'}
function publicSpaceCard(r,date){const arr=getBookings(date,r.id).filter(b=>b.status==='confirmed');const isToday=localISO(date)===localISO(new Date());const current=isToday?arr.find(b=>currentStatus(b)):null;const now=new Date().toTimeString().slice(0,5);const future=isToday?arr.filter(b=>b.startTime>now):arr;const next=future[0]||(!isToday?arr[0]:null);const cardState=current?'in-use':arr.length?'scheduled':'free';const pillClass=current?'busy':arr.length?'scheduled':'free';const pillText=current?'EM USO':arr.length?'AGENDADO':'LIVRE';let highlight;
 if(current){highlight=`<div class="current-box"><div class="eyebrow">Em uso agora</div><strong>${escapeHtml(current.responsible)}</strong><span>${escapeHtml(displayPurpose(current))} · ${periodLabel(current)}</span></div>`}
 else if(arr.length){const target=next||arr[0];highlight=`<div class="current-box scheduled"><div class="eyebrow">${isToday&&next?'Próximo agendamento':'Agenda desta data'}</div><strong>${isToday&&next?`${next.startTime} · ${escapeHtml(next.responsible)}`:`${arr.length} agendamento${arr.length>1?'s':''}`}</strong><span>${isToday&&next?`${escapeHtml(displayPurpose(next))} · até ${next.endTime}`:`Primeiro horário: ${periodLabel(target)}`}</span></div>`}
 else{highlight=`<div class="current-box empty"><div class="eyebrow">Situação da data</div><strong>Espaço livre</strong><span>Sem agendamentos para esta data</span></div>`}
 const rows=arr.length?arr.map(b=>`<div class="schedule-row ${current?.id===b.id?'now':''}"><span class="slot">${periodLabel(b)}</span><span class="who"><strong>${escapeHtml(b.responsible)}</strong><small>${escapeHtml(displayPurpose(b))}</small></span></div>`).join(''):'<div style="color:#b9cad8;font-size:16px;font-weight:700">Nenhum agendamento.</div>';
 return `<article class="space-card ${cardState}"><div class="space-head"><div><h2>${escapeHtml(r.name)}</h2><small>${escapeHtml(r.type)}</small></div><span class="status-pill ${pillClass}">${pillText}</span></div>${highlight}<div class="schedule-list">${rows}</div></article>`}
function movePublicDate(n){window.publicDate=addDays(window.publicDate||new Date(),n);renderPublic()}
function updateClock(){const now=new Date();const c=document.getElementById('clock'),d=document.getElementById('clockDate');if(c)c.textContent=now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});if(d)d.textContent=formatDate(now,{day:'2-digit',month:'2-digit',year:'numeric'})}
function toggleFullscreen(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()}
async function bootstrap(){try{const d=await fetchPublicJson();mergeRemoteData(d)}catch(e){syncInfo={status:'error',last:null,message:e.message}}route();}
bootstrap();
</script>

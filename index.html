<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b5cab" />
  <title>Agenda de Espaços FMP</title>
  <style>
    :root{
      --primary:#0b5cab;
      --primary-2:#073f79;
      --success:#138a59;
      --success-soft:#e7f7ef;
      --warning:#c47a00;
      --danger:#c23737;
      --ink:#182230;
      --muted:#667085;
      --line:#dbe3ed;
      --surface:#ffffff;
      --surface-2:#f4f7fb;
      --shadow:0 12px 35px rgba(19,42,76,.12);
      --radius:18px;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--surface-2)}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    .hidden{display:none!important}
    .app{min-height:100vh}
    .btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;display:inline-flex;align-items:center;gap:8px;justify-content:center;transition:.2s}
    .btn:hover{transform:translateY(-1px)}
    .btn-primary{background:var(--primary);color:#fff;box-shadow:0 7px 16px rgba(11,92,171,.22)}
    .btn-secondary{background:#fff;color:var(--primary);border:1px solid #bed1e6}
    .btn-success{background:var(--success);color:#fff}
    .btn-ghost{background:transparent;color:var(--ink)}
    .btn-danger{background:#fff0f0;color:var(--danger);border:1px solid #ffd0d0}
    .icon-btn{width:42px;height:42px;padding:0;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink)}
    .tag{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800}
    .tag-blue{color:var(--primary);background:#eaf3fc}.tag-green{color:var(--success);background:var(--success-soft)}
    .tag-orange{color:#995d00;background:#fff3dc}.tag-gray{color:#5b6675;background:#edf1f5}
    .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
    .logo{width:48px;height:48px;border-radius:14px;background:linear-gradient(145deg,var(--primary),#2b86d8);color:#fff;display:grid;place-items:center;font-weight:900;letter-spacing:.5px;overflow:hidden;box-shadow:0 8px 20px rgba(11,92,171,.22)}
    .logo img{width:100%;height:100%;object-fit:contain;background:#fff}

    /* Login */
    .login-page{min-height:100vh;display:grid;grid-template-columns:1.08fr .92fr;background:#fff}
    .login-brand{position:relative;overflow:hidden;padding:70px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;background:linear-gradient(145deg,#062d57 0%,var(--primary) 56%,#0b8b66 145%)}
    .login-brand:before,.login-brand:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.08)}
    .login-brand:before{width:430px;height:430px;right:-180px;top:-120px}.login-brand:after{width:260px;height:260px;left:-100px;bottom:-90px}
    .brand-head{display:flex;align-items:center;gap:14px;position:relative;z-index:2}.brand-head .logo{background:#fff;color:var(--primary)}
    .brand-title{font-size:42px;line-height:1.08;margin:0;max-width:650px;position:relative;z-index:2}
    .brand-sub{font-size:18px;line-height:1.55;opacity:.9;max-width:590px;position:relative;z-index:2}
    .brand-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;position:relative;z-index:2}
    .brand-card{padding:18px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.09);border-radius:16px;backdrop-filter:blur(9px)}
    .brand-card strong{display:block;font-size:20px;margin-bottom:6px}.brand-card span{font-size:13px;opacity:.82}
    .login-box-wrap{display:grid;place-items:center;padding:42px}
    .login-box{width:min(440px,100%)}
    .login-box h2{font-size:30px;margin:18px 0 8px}.login-box p{color:var(--muted);margin:0 0 28px;line-height:1.5}
    .field{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}.field label{font-size:13px;font-weight:800;color:#344054}
    .field input,.field select,.field textarea{border:1px solid #cdd8e5;border-radius:12px;padding:12px 13px;background:#fff;color:var(--ink);outline:0}
    .field input:focus,.field select:focus,.field textarea:focus{border-color:#5d9bd5;box-shadow:0 0 0 4px rgba(11,92,171,.1)}
    .login-actions{display:grid;gap:10px;margin-top:22px}.demo-info{margin-top:18px;padding:12px;border-radius:12px;background:#f5f8fc;color:#536174;font-size:13px;line-height:1.45}

    /* Admin shell */
    .shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
    .sidebar{background:#081d35;color:#fff;padding:22px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
    .side-brand{display:flex;align-items:center;gap:12px;padding:4px 8px 22px;border-bottom:1px solid rgba(255,255,255,.09)}
    .side-brand strong{display:block}.side-brand small{color:#a9bdd3}
    .nav{display:grid;gap:6px;margin-top:20px}.nav button{display:flex;align-items:center;gap:11px;text-align:left;border:0;border-radius:11px;padding:12px;color:#c2d2e4;background:transparent;font-weight:700}
    .nav button.active,.nav button:hover{background:#11395f;color:#fff}.nav-spacer{flex:1}
    .side-foot{display:grid;gap:9px;border-top:1px solid rgba(255,255,255,.09);padding-top:16px}.side-foot button{color:#c2d2e4}
    .main{min-width:0}.topbar{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:20}
    .topbar h1{font-size:22px;margin:0}.topbar small{color:var(--muted)}.top-actions{display:flex;align-items:center;gap:10px}
    .content{padding:26px;max-width:1600px;margin:auto}
    .summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px}
    .summary{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 4px 15px rgba(19,42,76,.04)}
    .summary .label{font-size:13px;color:var(--muted);font-weight:700}.summary .value{font-size:30px;font-weight:900;margin-top:8px}.summary .detail{font-size:12px;color:var(--muted);margin-top:6px}
    .toolbar{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap}.toolbar-group{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .segmented{display:flex;padding:4px;background:#eaf0f7;border-radius:12px}.segmented button{border:0;background:transparent;padding:8px 12px;border-radius:9px;font-weight:800;color:#58687a}.segmented button.active{background:#fff;color:var(--primary);box-shadow:0 3px 10px rgba(19,42,76,.08)}
    .calendar-card{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 5px 18px rgba(19,42,76,.05)}
    .week-grid{display:grid;grid-template-columns:170px repeat(7,minmax(150px,1fr));overflow:auto}
    .week-head,.resource-name,.week-cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:118px}
    .week-head{min-height:auto;padding:13px;background:#f8fafc;text-align:center;position:sticky;top:76px;z-index:5}.week-head:first-child{text-align:left;left:0;z-index:8}
    .week-head strong{display:block;font-size:13px}.week-head span{font-size:12px;color:var(--muted)}.week-head.today{background:#eaf4ff;color:var(--primary)}
    .resource-name{padding:15px;position:sticky;left:0;background:#fff;z-index:4}.resource-name strong{display:block}.resource-name small{color:var(--muted)}
    .week-cell{padding:8px;background:#fff}.week-cell:hover{background:#fbfdff}
    .booking{border-left:4px solid var(--primary);background:#edf6ff;border-radius:10px;padding:8px;margin-bottom:7px;font-size:11px;line-height:1.35;cursor:pointer}
    .booking strong{display:block;font-size:12px}.booking .time{font-weight:800;color:var(--primary)}.booking.current{border-color:var(--success);background:var(--success-soft)}
    .month-grid{display:grid;grid-template-columns:repeat(7,1fr)}.month-weekday{background:#f8fafc;padding:12px;text-align:center;font-size:12px;font-weight:900;color:#667085;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
    .month-day{min-height:130px;padding:9px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#fff}.month-day.other{background:#fafbfc;color:#a0a9b5}.month-day.today{box-shadow:inset 0 0 0 2px #5c9dde}.day-number{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:900;margin-bottom:7px}.count-badge{font-size:10px;background:#e8f1fb;color:var(--primary);padding:3px 6px;border-radius:999px}
    .month-booking{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#eff6ff;border-radius:6px;padding:4px 5px;margin-bottom:4px;border-left:3px solid var(--primary)}
    .empty-state{padding:45px;text-align:center;color:var(--muted)}

    /* Config */
    .settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 5px 18px rgba(19,42,76,.04)}
    .panel h3{margin:0 0 5px}.panel .sub{color:var(--muted);font-size:13px;margin-bottom:20px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.form-grid .full{grid-column:1/-1}
    .resource-list,.user-list{display:grid;gap:8px}.resource-item,.user-item{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:12px;padding:11px 12px}.resource-item span,.user-item span{display:flex;align-items:center;gap:9px}
    .resource-dot{width:10px;height:10px;border-radius:50%;background:var(--primary)}

    /* Modal */
    .modal-backdrop{position:fixed;inset:0;background:rgba(5,18,33,.65);display:grid;place-items:center;padding:22px;z-index:100;backdrop-filter:blur(3px)}
    .modal{background:#fff;border-radius:20px;width:min(780px,100%);max-height:92vh;overflow:auto;box-shadow:0 25px 70px rgba(0,0,0,.3)}
    .modal-head{display:flex;align-items:center;justify-content:space-between;padding:20px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}.modal-head h2{font-size:21px;margin:0}.modal-body{padding:22px}.modal-foot{display:flex;justify-content:flex-end;gap:10px;border-top:1px solid var(--line);padding:16px 22px;position:sticky;bottom:0;background:#fff}
    .alert{border-radius:12px;padding:12px 13px;font-size:13px;margin-bottom:15px}.alert-error{background:#fff0f0;color:#9c2828;border:1px solid #ffd0d0}.alert-info{background:#edf6ff;color:#245c8c;border:1px solid #cce5fb}

    /* Painel público / modo TV */
    .public-page{min-height:100vh;background:radial-gradient(circle at 12% 0,#163f68 0,#071a30 46%,#03101e 100%);color:#fff;padding:26px 30px;display:flex;flex-direction:column}
    .public-header{display:flex;align-items:center;justify-content:space-between;gap:22px;padding:2px 2px 18px}.public-brand{display:flex;align-items:center;gap:16px}.public-brand .logo{width:62px;height:62px;border-radius:16px}.public-brand h1{margin:0;font-size:clamp(28px,2.25vw,44px);line-height:1.05;letter-spacing:-.025em}.public-brand p{margin:7px 0 0;color:#c1d2e2;font-size:clamp(14px,1vw,19px);font-weight:700}.public-clock{text-align:right;min-width:180px}.public-clock strong{font-size:clamp(42px,4vw,72px);line-height:.9;display:block;letter-spacing:-.04em}.public-clock span{display:block;color:#c1d2e2;font-size:clamp(14px,1.15vw,21px);font-weight:800;margin-top:8px}
    .public-toolbar{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.10)}.date-nav{display:flex;align-items:center;gap:10px}.date-nav button{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.20);color:#fff}.date-label{font-weight:950;font-size:clamp(20px,1.55vw,30px);min-width:310px;text-align:center;text-transform:capitalize}
    .public-grid{display:grid;grid-template-columns:repeat(4,minmax(250px,1fr));gap:18px;align-items:stretch;flex:1}.space-card{position:relative;background:#13283d;border:2px solid #354a5e;border-radius:22px;padding:21px 22px;min-height:315px;box-shadow:0 16px 36px rgba(0,0,0,.25);transition:.2s;overflow:hidden}.space-card:before{content:"";position:absolute;inset:0 auto 0 0;width:8px;background:#718397}.space-card.free{background:linear-gradient(155deg,#14283b,#0d1d2d);border-color:#40556a}.space-card.scheduled{background:linear-gradient(155deg,#123f67,#0a2b49);border-color:#54aff2;box-shadow:0 18px 44px rgba(0,91,168,.32),inset 0 0 0 1px rgba(115,194,255,.15)}.space-card.scheduled:before{background:#59b8ff}.space-card.in-use{background:linear-gradient(155deg,#0d5940,#073e2d);border-color:#61edaf;box-shadow:0 20px 48px rgba(0,138,88,.38),0 0 0 4px rgba(71,224,158,.12)}.space-card.in-use:before{background:#5cf0ad}.space-card.in-use:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;right:-90px;top:-90px;background:rgba(105,255,185,.10)}
    .space-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding-bottom:15px;border-bottom:1px solid rgba(255,255,255,.16);position:relative;z-index:1}.space-head h2{font-size:clamp(23px,1.65vw,33px);line-height:1.05;margin:0;font-weight:950;letter-spacing:-.02em}.space-head small{display:block;color:#ccdae7;font-size:clamp(12px,.8vw,16px);font-weight:700;margin-top:7px}.status-pill{font-size:clamp(12px,.75vw,15px);font-weight:950;border-radius:999px;padding:8px 12px;background:#34485b;white-space:nowrap;letter-spacing:.03em}.status-pill.free{color:#f2f6fa}.status-pill.scheduled{background:#117dcc;color:#fff;box-shadow:0 0 0 4px rgba(40,154,239,.18)}.status-pill.busy{background:#10a86b;color:#fff;box-shadow:0 0 0 5px rgba(46,215,145,.18)}
    .current-box{position:relative;z-index:1;margin:16px 0;padding:16px 17px;border-radius:16px;background:rgba(26,200,130,.17);border:1px solid rgba(95,239,177,.47)}.current-box.scheduled{background:rgba(31,144,228,.18);border-color:rgba(91,185,255,.48)}.current-box.empty{background:rgba(255,255,255,.055);border-color:rgba(255,255,255,.10)}
    .current-box .eyebrow{text-transform:uppercase;letter-spacing:.10em;font-size:clamp(11px,.7vw,14px);color:#8ff2c4;font-weight:950}.current-box.scheduled .eyebrow{color:#9ed5ff}.current-box.empty .eyebrow{color:#c0cfdd}.current-box strong{display:block;font-size:clamp(21px,1.45vw,29px);line-height:1.12;margin-top:7px;font-weight:950}.current-box span{display:block;color:#e5eef6;font-size:clamp(14px,.95vw,19px);line-height:1.25;margin-top:7px;font-weight:700}
    .status-legend{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.legend-item{display:inline-flex;align-items:center;gap:8px;padding:8px 11px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.07);border-radius:999px;font-size:clamp(12px,.7vw,15px);font-weight:900;color:#eef4f9}.legend-dot{width:11px;height:11px;border-radius:50%;background:#8394a5}.legend-item.scheduled .legend-dot{background:#59b8ff;box-shadow:0 0 0 4px rgba(82,173,244,.13)}.legend-item.busy .legend-dot{background:#5cf0ad;box-shadow:0 0 0 4px rgba(66,225,157,.13)}
    .schedule-list{display:grid;gap:9px}.schedule-row{display:grid;grid-template-columns:minmax(108px,.38fr) 1fr;gap:12px;align-items:center;font-size:clamp(14px,.88vw,18px);padding:5px 0}.schedule-row .slot{font-weight:950;color:#9ed5ff;white-space:nowrap}.schedule-row .who{min-width:0;color:#f2f6fa;line-height:1.15}.schedule-row .who strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:1.04em}.schedule-row .who small{display:block;color:#bed0df;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px;font-size:.82em}.schedule-row.now{background:rgba(55,221,150,.10);border-radius:10px;padding:7px 8px}.schedule-row.now .slot,.schedule-row.now .who strong{color:#75f0bc}
    .public-foot{display:flex;justify-content:space-between;gap:16px;color:#b5c6d5;font-size:clamp(12px,.72vw,15px);font-weight:700;padding:16px 4px 0}.sync-note{display:inline-flex;align-items:center;gap:7px}.sync-note:before{content:"";width:8px;height:8px;border-radius:50%;background:#64e5a9;box-shadow:0 0 0 4px rgba(100,229,169,.12)}.sync-note.offline:before{background:#f2b94b}.fullscreen-btn{background:rgba(255,255,255,.10);color:#fff;border:1px solid rgba(255,255,255,.20);font-weight:850}
    .sync-badge{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:7px 10px;background:#edf7f2;color:#187853;font-size:12px;font-weight:850;border:1px solid #c8eadb}.sync-badge.warn{background:#fff7e8;color:#8a5a00;border-color:#f1d9a7}.sync-badge.error{background:#fff0f0;color:#a02d2d;border-color:#f0c7c7}

    .toast{position:fixed;right:22px;bottom:22px;background:#12283f;color:#fff;padding:13px 16px;border-radius:12px;box-shadow:var(--shadow);z-index:200;animation:slide .25s ease}
    @keyframes slide{from{transform:translateY(15px);opacity:0}to{transform:none;opacity:1}}

    @media(max-width:1100px){.login-page{grid-template-columns:1fr}.login-brand{display:none}.shell{grid-template-columns:82px 1fr}.side-brand div,.nav button span,.side-foot span{display:none}.side-brand{justify-content:center}.nav button{justify-content:center}.summary-grid{grid-template-columns:repeat(2,1fr)}.public-grid{grid-template-columns:repeat(2,1fr)}.settings-grid{grid-template-columns:1fr}}
    @media(max-height:850px) and (min-width:1200px){.public-page{padding:14px 20px}.public-header{padding-bottom:10px}.public-brand .logo{width:48px;height:48px}.public-toolbar{margin-bottom:10px;padding:8px 10px}.space-card{min-height:245px;padding:14px 16px}.current-box{margin:10px 0;padding:10px 12px}.schedule-list{gap:4px}.schedule-row{padding:2px 0}.public-foot{padding-top:8px}}
    @media(max-width:700px){.content{padding:16px}.topbar{padding:0 15px}.topbar small{display:none}.summary-grid{grid-template-columns:1fr 1fr;gap:10px}.summary{padding:14px}.summary .value{font-size:24px}.shell{grid-template-columns:1fr}.sidebar{position:fixed;height:auto;bottom:0;top:auto;left:0;right:0;z-index:50;display:block;padding:7px;background:#071a2e}.side-brand,.side-foot{display:none}.nav{display:flex;margin:0;justify-content:space-around}.nav button{padding:10px}.main{padding-bottom:68px}.public-page{padding:12px}.public-grid{grid-template-columns:1fr}.public-header{align-items:flex-start}.public-clock strong{font-size:23px}.public-brand h1{font-size:20px}.form-grid{grid-template-columns:1fr}.form-grid .full{grid-column:auto}.month-day{min-height:100px}.month-booking{display:none}}


    /* =========================================================
       RESPONSIVIDADE ADAPTATIVA — TV, DESKTOP, TABLET E CELULAR
       Mantém a lógica do sistema e ajusta somente apresentação.
       ========================================================= */
    html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-behavior:smooth}
    body{min-width:0;overflow-x:hidden}
    button,a,input,select,textarea{touch-action:manipulation}
    img{max-width:100%}
    .main,.content,.panel,.calendar-card,.public-page,.public-grid,.space-card{min-width:0}

    /* Painel: usa melhor o espaço disponível sem deformar os cartões. */
    .public-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
    .space-card{height:100%}
    .space-head>div,.schedule-row .who{min-width:0}

    /* TV / monitor Full HD e telas grandes: 3 colunas x 2 linhas para os 6 espaços fixos. */
    @media (min-width:1500px){
      .public-page{padding:28px 38px}
      .public-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
      .space-card{min-height:330px;padding:22px 24px}
      .space-head h2{font-size:clamp(28px,1.7vw,36px)}
      .current-box strong{font-size:clamp(24px,1.45vw,31px)}
      .schedule-row{font-size:clamp(16px,.95vw,20px);grid-template-columns:minmax(120px,.34fr) 1fr}
      .status-pill{font-size:clamp(13px,.78vw,16px)}
    }

    /* TVs 4K / painéis de alta resolução: amplia leitura à distância. */
    @media (min-width:2200px){
      .public-page{padding:42px 56px}
      .public-header{padding-bottom:26px}
      .public-brand .logo{width:82px;height:82px}
      .public-brand h1{font-size:56px}
      .public-brand p{font-size:24px}
      .public-clock{min-width:250px}.public-clock strong{font-size:88px}.public-clock span{font-size:25px}
      .public-toolbar{padding:18px 20px;margin-bottom:24px}
      .date-label{font-size:36px;min-width:430px}
      .status-legend .legend-item{font-size:19px;padding:11px 15px}
      .public-grid{gap:26px}
      .space-card{min-height:430px;padding:29px 31px;border-radius:28px}
      .space-head h2{font-size:43px}.space-head small{font-size:21px}
      .status-pill{font-size:19px;padding:11px 16px}
      .current-box{padding:21px 22px;margin:20px 0}.current-box .eyebrow{font-size:17px}.current-box strong{font-size:35px}.current-box span{font-size:23px}
      .schedule-row{font-size:23px;grid-template-columns:155px 1fr;gap:17px;padding:7px 0}
      .public-foot{font-size:18px;padding-top:22px}
    }

    /* Notebook / tablet horizontal. */
    @media (min-width:1101px) and (max-width:1499px){
      .public-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
      .space-card{min-height:280px;padding:17px 18px}
      .public-page{padding:18px 20px}
      .schedule-row{grid-template-columns:minmax(102px,.35fr) 1fr}
    }

    /* Tablet e telas intermediárias. */
    @media (min-width:701px) and (max-width:900px){
      .public-page{padding:16px}
      .public-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
      .space-card{min-height:285px;padding:18px}
      .public-header{gap:14px}
      .public-brand h1{font-size:clamp(24px,3.3vw,32px)}
      .public-clock strong{font-size:clamp(34px,5vw,48px)}
      .public-toolbar{align-items:flex-start}
      .date-label{min-width:230px;font-size:20px}
      .status-legend{width:100%;order:3}
      .schedule-row{grid-template-columns:100px 1fr}
    }

    /* Celular: uma coluna, controles grandes para toque e leitura sem zoom. */
    @media (max-width:700px){
      .public-page{min-height:100dvh;padding:10px 10px 14px}
      .public-header{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;padding:2px 2px 12px}
      .public-brand{gap:10px;min-width:0}.public-brand .logo{width:46px;height:46px;border-radius:12px;flex:0 0 auto}
      .public-brand h1{font-size:clamp(19px,5.7vw,25px);white-space:normal}.public-brand p{font-size:12px;margin-top:4px;white-space:normal}
      .public-clock{min-width:auto}.public-clock strong{font-size:clamp(28px,9vw,39px)}.public-clock span{font-size:11px;margin-top:4px}
      .public-toolbar{display:grid;grid-template-columns:1fr;gap:11px;margin-bottom:12px;padding:11px}
      .date-nav{width:100%;display:grid;grid-template-columns:44px minmax(0,1fr) 44px;gap:8px}
      .date-nav .icon-btn{width:44px;height:44px}
      .date-nav>.btn{width:100%;min-height:44px}
      .date-label{grid-column:1/-1;grid-row:2;min-width:0;width:100%;font-size:clamp(18px,5.2vw,23px);padding:3px 0;text-align:center}
      .status-legend{justify-content:center;gap:6px;width:100%}
      .legend-item{font-size:11px;padding:7px 9px}.legend-dot{width:9px;height:9px}
      .public-toolbar>div:last-child{display:grid!important;grid-template-columns:1fr 1fr;width:100%;gap:8px!important}
      .public-toolbar>div:last-child .btn{width:100%;min-height:44px;padding:10px 8px;font-size:13px}
      .public-grid{grid-template-columns:1fr;gap:12px}
      .space-card{min-height:0;padding:16px 16px 17px;border-radius:18px}
      .space-card:before{width:6px}
      .space-head{gap:8px;padding-bottom:12px}.space-head h2{font-size:clamp(22px,6vw,28px)}.space-head small{font-size:12px;margin-top:5px}
      .status-pill{font-size:11px;padding:7px 9px;flex:0 0 auto}
      .current-box{margin:12px 0;padding:13px 14px}.current-box .eyebrow{font-size:10px}.current-box strong{font-size:clamp(20px,5.7vw,25px)}.current-box span{font-size:14px}
      .schedule-list{gap:6px}.schedule-row{grid-template-columns:94px minmax(0,1fr);gap:9px;font-size:14px;padding:4px 0}.schedule-row .who strong{font-size:15px}.schedule-row .who small{font-size:12px}
      .public-foot{flex-direction:column;align-items:flex-start;gap:7px;font-size:11px;padding:12px 3px 0}

      /* Administração também utilizável no celular. */
      .topbar{height:auto;min-height:76px;padding:10px 12px;align-items:flex-start;flex-direction:column;gap:8px}
      .topbar h1{font-size:19px}.topbar small{display:block;font-size:11px}
      .top-actions{width:100%;overflow-x:auto;overscroll-behavior-inline:contain;padding-bottom:3px;scrollbar-width:thin}
      .top-actions>*{flex:0 0 auto}.top-actions .btn{white-space:nowrap;padding:9px 11px;font-size:12px}.sync-badge{white-space:nowrap}
      .content{padding:12px}
      .summary-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.summary{padding:12px}.summary .label{font-size:11px}.summary .value{font-size:24px}.summary .detail{font-size:10px}
      .toolbar{align-items:flex-start}.toolbar-group{width:100%}.segmented{flex:1}.segmented button{flex:1}
      .week-grid{grid-template-columns:125px repeat(7,minmax(140px,1fr))}.week-head{top:0}.resource-name{padding:10px}.week-cell{padding:6px}.booking{font-size:10px}
      .month-grid{min-width:680px}.calendar-card{overflow:auto;-webkit-overflow-scrolling:touch}
      .settings-grid{grid-template-columns:1fr}.panel{padding:15px}.resource-item,.user-item{align-items:flex-start;gap:8px}.resource-item>span,.user-item>span{min-width:0}
      .modal-backdrop{padding:0;place-items:end center}.modal{width:100%;max-height:94dvh;border-radius:20px 20px 0 0}.modal-head{padding:15px 16px}.modal-body{padding:16px}.modal-foot{padding:12px 16px;gap:8px;flex-wrap:wrap}.modal-foot .btn{flex:1 1 135px;min-height:44px}
      .field input,.field select,.field textarea{font-size:16px} /* evita zoom automático no iPhone */
      .toast{left:12px;right:12px;bottom:78px;text-align:center}
    }

    /* Celulares muito estreitos. */
    @media (max-width:390px){
      .public-header{grid-template-columns:1fr}.public-clock{text-align:left;display:flex;align-items:baseline;gap:8px}.public-clock strong{font-size:30px}.public-clock span{margin:0}
      .public-toolbar>div:last-child{grid-template-columns:1fr}
      .status-legend{justify-content:flex-start}
      .summary-grid{grid-template-columns:1fr 1fr}
      .schedule-row{grid-template-columns:86px minmax(0,1fr)}
    }

    /* Celular deitado / telas baixas: compacta cabeçalho sem esconder informação. */
    @media (orientation:landscape) and (max-height:600px) and (max-width:1000px){
      .public-page{padding:8px 12px}.public-header{padding-bottom:7px}.public-brand .logo{width:40px;height:40px}.public-brand h1{font-size:20px}.public-brand p{display:none}
      .public-clock strong{font-size:29px}.public-clock span{font-size:10px}
      .public-toolbar{padding:7px 9px;margin-bottom:8px}.date-label{font-size:17px}.legend-item{padding:5px 7px;font-size:10px}
      .public-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.space-card{padding:12px;min-height:0}.space-head h2{font-size:20px}.space-head small{font-size:10px}.status-pill{font-size:10px;padding:5px 7px}
      .current-box{margin:8px 0;padding:8px 10px}.current-box strong{font-size:18px}.current-box span{font-size:12px}.schedule-row{font-size:12px;grid-template-columns:82px 1fr;padding:2px 0}.public-foot{display:none}
    }

    /* Notebooks e TVs com pouca altura (ex.: 1366×768): mantém as 6 salas visíveis com boa leitura. */
    @media (max-height:850px) and (min-width:1101px){
      .public-page{padding:12px 18px}.public-header{padding-bottom:8px}.public-brand .logo{width:48px;height:48px}.public-brand h1{font-size:28px}.public-brand p{font-size:13px;margin-top:4px}
      .public-clock strong{font-size:42px}.public-clock span{font-size:13px;margin-top:4px}.public-toolbar{padding:8px 10px;margin-bottom:8px}.date-label{font-size:20px}
      .public-grid{gap:10px}.space-card{min-height:235px;padding:13px 15px}.space-head{padding-bottom:9px}.space-head h2{font-size:23px}.space-head small{font-size:11px;margin-top:4px}.status-pill{font-size:11px;padding:6px 8px}
      .current-box{margin:8px 0;padding:9px 11px}.current-box .eyebrow{font-size:9px}.current-box strong{font-size:19px;margin-top:4px}.current-box span{font-size:12px;margin-top:4px}
      .schedule-list{gap:3px}.schedule-row{font-size:12px;grid-template-columns:92px 1fr;gap:8px;padding:1px 0}.schedule-row .who small{margin-top:1px}.public-foot{font-size:11px;padding-top:6px}
    }


    /* =========================================================
       PAINEL DE SALAS DE AULA — IDENTIDADE VERDE
       ========================================================= */
    .classroom-page{
      min-height:100vh;
      background:radial-gradient(circle at 12% 0,#185942 0,#0b3126 48%,#041b15 100%);
      color:#fff;padding:26px 30px;display:flex;flex-direction:column;
    }
    .classroom-page .public-toolbar{
      background:rgba(117,255,186,.07);
      border-color:rgba(132,255,197,.17);
    }
    .classroom-page .fullscreen-btn,
    .classroom-page .date-nav button{
      background:rgba(108,255,184,.09);
      border-color:rgba(142,255,204,.22);
    }
    .classroom-periods{display:flex;gap:8px;flex-wrap:wrap}
    .classroom-periods button{
      border:1px solid rgba(139,255,201,.20);
      background:rgba(255,255,255,.06);color:#dff8eb;
      border-radius:999px;padding:9px 12px;font-weight:900;
    }
    .classroom-periods button.active{
      background:#1aa56f;border-color:#5de0aa;color:#fff;
      box-shadow:0 0 0 4px rgba(75,226,163,.13);
    }
    .classroom-panel-note{
      display:flex;align-items:center;justify-content:space-between;gap:14px;
      padding:11px 14px;margin:0 0 16px;border-radius:15px;
      background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.10);
      color:#d5eee2;font-size:clamp(13px,.82vw,17px);font-weight:800;
    }
    .classroom-grid{
      display:grid;grid-template-columns:repeat(4,minmax(230px,1fr));
      gap:16px;align-items:stretch;flex:1;
    }
    .classroom-card{
      position:relative;min-height:230px;padding:19px 20px;border-radius:21px;
      border:2px solid #3e8067;
      background:linear-gradient(155deg,#124b39,#0b3428);
      box-shadow:0 16px 38px rgba(0,0,0,.24);
      overflow:hidden;
    }
    .classroom-card:before{
      content:"";position:absolute;inset:0 auto 0 0;width:8px;background:#54d59e;
    }
    .classroom-card.unassigned{
      border-color:#d6a447;background:linear-gradient(155deg,#4a3b18,#30260f);
    }
    .classroom-card.unassigned:before{background:#f0b84e}
    .classroom-card.exception{
      box-shadow:0 18px 44px rgba(0,155,97,.30),inset 0 0 0 1px rgba(95,237,173,.16);
    }
    .classroom-card.lab-relocation{
      border-color:#54aff2;background:linear-gradient(155deg,#123f67,#0a2b49);
      box-shadow:0 18px 44px rgba(0,91,168,.30),inset 0 0 0 1px rgba(115,194,255,.14);
    }
    .classroom-card.lab-relocation:before{background:#59b8ff}
    .classroom-card.lab-relocation .room-tag{background:#117dcc}
    .classroom-card.lab-relocation .classroom-course{color:#cce9ff}
    .classroom-card.lab-relocation .classroom-time{background:rgba(91,185,255,.14);color:#a8dcff}
    .classroom-card.conflict{
      border-color:#ff8b8b;background:linear-gradient(155deg,#592323,#361515);
      box-shadow:0 18px 44px rgba(177,43,43,.30),inset 0 0 0 1px rgba(255,151,151,.13);
    }
    .classroom-card.conflict:before{background:#ff7272}
    .classroom-card.conflict .room-tag{background:#c83f3f}
    .classroom-card.conflict .classroom-course{color:#ffd4d4}
    .classroom-card.conflict .classroom-time{background:rgba(255,128,128,.12);color:#ffc0c0}
    .classroom-conflict-detail{
      margin-top:12px;padding:9px 10px;border-radius:10px;background:rgba(255,255,255,.08);
      border:1px solid rgba(255,190,190,.22);color:#ffe0e0;font-size:13px;font-weight:800;line-height:1.35
    }
    .current-box.conflict{background:rgba(194,55,55,.20);border-color:rgba(255,126,126,.55)}
    .current-box.conflict .eyebrow{color:#ffb0b0}
    .schedule-row.conflict{background:rgba(194,55,55,.15);border:1px solid rgba(255,126,126,.28);border-radius:10px;padding:7px 8px}
    .schedule-row.conflict .slot,.schedule-row.conflict .who strong{color:#ffbcbc}
    .classroom-room{
      display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
      padding-bottom:13px;border-bottom:1px solid rgba(255,255,255,.15)
    }
    .classroom-room h2{
      margin:0;font-size:clamp(27px,1.8vw,38px);line-height:1;font-weight:950;
      letter-spacing:-.025em;
    }
    .classroom-room .room-tag{
      white-space:nowrap;border-radius:999px;padding:7px 10px;
      background:#168b60;color:#fff;font-size:12px;font-weight:950;letter-spacing:.04em
    }
    .classroom-card.unassigned .room-tag{background:#9c6d13}
    .classroom-professor{
      margin-top:17px;font-size:clamp(22px,1.45vw,31px);font-weight:950;line-height:1.08
    }
    .classroom-course{
      margin-top:8px;color:#c7ead9;font-size:clamp(15px,.95vw,20px);font-weight:850
    }
    .classroom-time{
      margin-top:16px;display:inline-flex;align-items:center;gap:7px;
      border-radius:10px;padding:8px 10px;background:rgba(103,236,171,.12);
      color:#9ff0c7;font-weight:950;font-size:clamp(14px,.84vw,18px)
    }
    .classroom-empty{
      grid-column:1/-1;display:grid;place-items:center;text-align:center;
      min-height:300px;border:2px dashed rgba(167,234,199,.24);
      border-radius:22px;color:#d4e9de;padding:30px
    }
    .classroom-empty strong{display:block;font-size:30px;margin-bottom:8px}
    .room-admin-header{
      display:flex;align-items:flex-start;justify-content:space-between;gap:16px;
      flex-wrap:wrap;margin-bottom:18px
    }
    .room-assignment-grid{
      display:grid;grid-template-columns:repeat(3,minmax(230px,1fr));gap:14px
    }
    .room-assignment-card{
      border:1px solid #cfe7dc;background:#fbfefd;border-radius:15px;padding:15px
    }
    .room-assignment-card strong{display:block;font-size:15px;margin-bottom:4px}
    .room-assignment-card small{display:block;color:var(--muted);margin-bottom:10px}
    .room-assignment-card input{
      width:100%;border:1px solid #bad8cb;border-radius:11px;padding:11px 12px;
      outline:0;background:#fff
    }
    .room-assignment-card input:focus{
      border-color:#31a774;box-shadow:0 0 0 4px rgba(36,161,108,.11)
    }
    .room-summary{
      display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px
    }
    .room-summary .summary{border-color:#d5e9df}
    .booking-area-hint{
      margin-top:-7px;margin-bottom:10px;font-size:12px;color:var(--muted);font-weight:700
    }

    @media (min-width:2200px){
      .classroom-page{padding:42px 56px}
      .classroom-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}
      .classroom-card{min-height:310px;padding:27px 29px;border-radius:28px}
      .classroom-room h2{font-size:48px}
      .classroom-professor{font-size:38px}
      .classroom-course{font-size:24px}
      .classroom-time{font-size:21px;padding:11px 14px}
    }
    @media (max-width:1499px){
      .classroom-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
      .room-assignment-grid{grid-template-columns:repeat(2,minmax(230px,1fr))}
    }
    @media (max-width:1000px){
      .classroom-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
      .classroom-page{padding:16px}
      .room-summary{grid-template-columns:1fr 1fr}
    }
    @media (max-width:700px){
      .classroom-page{padding:12px}
      .classroom-grid{grid-template-columns:1fr;gap:12px}
      .classroom-card{min-height:190px;padding:16px 17px}
      .classroom-room h2{font-size:28px}
      .classroom-professor{font-size:24px}
      .classroom-course{font-size:16px}
      .classroom-periods{width:100%;overflow-x:auto;flex-wrap:nowrap;padding-bottom:3px}
      .classroom-periods button{white-space:nowrap;min-height:42px}
      .classroom-panel-note{align-items:flex-start;flex-direction:column}
      .room-assignment-grid,.room-summary{grid-template-columns:1fr}
    }

    /* Respeita usuários que preferem menos animação. */
    @media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}

  
    /* ===== Gestão de Estoque integrada ===== */
    .stock-module-wrap{height:calc(100vh - 128px);min-height:680px;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#050505;box-shadow:0 8px 24px rgba(19,42,76,.10)}
    .stock-module-frame{display:block;width:100%;height:100%;border:0;background:#050505}
    .session-badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:7px 10px;background:#f2f6fb;color:#44566b;border:1px solid #dbe4ee;font-size:12px;font-weight:850;white-space:nowrap}
    .session-badge.warn{background:#fff4e5;color:#8a5800;border-color:#f0d29b}
    @media(max-width:1100px){.stock-module-wrap{height:calc(100vh - 118px);min-height:620px}}
    @media(max-width:700px){.stock-module-wrap{height:calc(100vh - 150px);min-height:560px;border-radius:12px}.session-badge{display:none}}

</style>

<body>
<div id="app" class="app"></div>

<div id="bookingModal" class="modal-backdrop hidden">
  <div class="modal">
    <div class="modal-head"><h2 id="modalTitle">Novo agendamento</h2><button class="icon-btn" onclick="closeBookingModal()">✕</button></div>
    <form id="bookingForm" onsubmit="saveBooking(event)">
      <div class="modal-body">
        <div id="bookingAlert" class="alert alert-error hidden"></div>
        <input type="hidden" id="bookingId" />
        <div class="form-grid">
          <div class="field"><label>Tipo de uso *</label><select id="bookingArea" required onchange="toggleBookingArea()"><option value="lab">Laboratório / Auditório</option><option value="classroom">Sala de aula / outro espaço</option></select><div class="booking-area-hint" id="bookingAreaHint">Reserva de laboratório, auditório ou outro espaço institucional.</div></div>
          <div class="field"><label id="resourceLabel">Espaço *</label><select id="resourceId" required onchange="toggleCustomSpace()"></select></div>
          <div class="field hidden" id="customSpaceField"><label>Informe o espaço *</label><input id="customSpaceName" placeholder="Ex.: Sala 12, Biblioteca, Hall, Sala de Reuniões..." /></div>
          <div class="field"><label>Responsável / professor *</label><input id="responsible" required placeholder="Ex.: Prof. Leandro Pickler" /></div>
          <div class="field"><label>Turma / curso / evento</label><select id="purpose" onchange="toggleCustomPurpose()">
            <option value="">Selecione a turma</option>
            <optgroup label="ADS">
              <option value="ADS — 1ª Fase">ADS — 1ª Fase</option>
              <option value="ADS — 2ª Fase">ADS — 2ª Fase</option>
              <option value="ADS — 3ª Fase">ADS — 3ª Fase</option>
              <option value="ADS — 4ª Fase">ADS — 4ª Fase</option>
              <option value="ADS — 5ª Fase">ADS — 5ª Fase</option>
            </optgroup>
            <optgroup label="TPG">
              <option value="TPG — 1ª Fase">TPG — 1ª Fase</option>
              <option value="TPG — 2ª Fase">TPG — 2ª Fase</option>
              <option value="TPG — 3ª Fase">TPG — 3ª Fase</option>
              <option value="TPG — 4ª Fase">TPG — 4ª Fase</option>
            </optgroup>
            <optgroup label="Administração">
              <option value="Administração — 1ª Fase">Administração — 1ª Fase</option>
              <option value="Administração — 2ª Fase">Administração — 2ª Fase</option>
              <option value="Administração — 3ª Fase">Administração — 3ª Fase</option>
              <option value="Administração — 4ª Fase">Administração — 4ª Fase</option>
              <option value="Administração — 5ª Fase">Administração — 5ª Fase</option>
              <option value="Administração — 6ª Fase">Administração — 6ª Fase</option>
              <option value="Administração — 7ª Fase">Administração — 7ª Fase</option>
              <option value="Administração — 8ª Fase">Administração — 8ª Fase</option>
            </optgroup>
            <optgroup label="Pedagogia">
              <option value="Pedagogia — 1ª Fase">Pedagogia — 1ª Fase</option>
              <option value="Pedagogia — 2ª Fase">Pedagogia — 2ª Fase</option>
              <option value="Pedagogia — 3ª Fase">Pedagogia — 3ª Fase</option>
              <option value="Pedagogia — 4ª Fase">Pedagogia — 4ª Fase</option>
              <option value="Pedagogia — 5ª Fase">Pedagogia — 5ª Fase</option>
              <option value="Pedagogia — 6ª Fase">Pedagogia — 6ª Fase</option>
              <option value="Pedagogia — 7ª Fase">Pedagogia — 7ª Fase</option>
              <option value="Pedagogia — 8ª Fase">Pedagogia — 8ª Fase</option>
            </optgroup>
            <option value="__custom_purpose__">Outra turma / curso / evento — digitar</option>
          </select></div>
          <div class="field hidden" id="customPurposeField"><label>Informe a turma / curso / evento</label><input id="customPurpose" placeholder="Ex.: Pós-graduação, reunião, capacitação..." /></div>
          <div class="field"><label>Tipo de horário</label><select id="periodType" onchange="applyPeriodPreset()"><option value="morning">Manhã — 08:00 às 11:10</option><option value="afternoon">Tarde — 13:00 às 17:00</option><option value="evening">Noite — 19:00 às 22:00</option><option value="morning1">Manhã 1 — 08:00 às 09:30</option><option value="morning2">Manhã 2 — 09:40 às 11:10</option><option value="afternoon1">Tarde 1 — 13:00 às 15:00</option><option value="afternoon2">Tarde 2 — 15:00 às 17:00</option><option value="evening1">Noite 1 — 19:00 às 20:30</option><option value="evening2">Noite 2 — 20:30 às 22:00</option><option value="classnight1">Aula Noturno 1 — 18:50 às 20:20</option><option value="classnight2">Aula Noturno 2 — 20:30 às 22:00</option><option value="custom">Meio período / horário personalizado</option></select></div>
          <div class="field"><label>Data inicial *</label><input type="date" id="startDate" required /></div>
          <div class="field"><label>Data final *</label><input type="date" id="endDate" required /></div>

let pendingLogo=null;

function loadLogo(e){const f=e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{pendingLogo=reader.result;toast('Logo carregada. Clique em salvar configurações.')} ;reader.readAsDataURL(f)}
function saveSettings(){state.settings.appName=document.getElementById('cfgAppName').value.trim()||'Agenda de Espaços FMP';state.settings.panelTitle=document.getElementById('cfgPanelTitle').value.trim()||'Painel de Laboratórios e Espaços';state.settings.classroomPanelTitle=document.getElementById('cfgClassroomPanelTitle').value.trim()||'Painel de Salas de Aula';if(pendingLogo){state.settings.logo=pendingLogo;pendingLogo=null}saveState();renderAdmin();toast('Configurações salvas.')}
async function saveGithub(){state.settings.github={owner:document.getElementById('ghOwner').value.trim(),repo:document.getElementById('ghRepo').value.trim(),branch:document.getElementById('ghBranch').value.trim()||'main',path:document.getElementById('ghPath').value.trim()||'dados/agendamentos.json',gradePath:document.getElementById('ghGradePath').value.trim()||'dados/grade-salas.json',usersPath:document.getElementById('ghUsersPath').value.trim()||'dados/usuarios.json',stockPath:document.getElementById('ghStockPath').value.trim()||'dados/estoque.json'};localStorage.setItem(GH_TOKEN_KEY,document.getElementById('ghToken').value.trim());saveState();toast('Conexão salva somente neste navegador.');await testGithubConnection();}

function resetUserForm(){['editUserId','newUserName','newUsername','newUserPassword'].forEach(id=>{const el=document.getElementById(id);if(el)el.value=''});const save=document.getElementById('saveUserBtn'),cancel=document.getElementById('cancelUserEditBtn'),pwd=document.getElementById('newUserPassword');if(save)save.textContent='Adicionar usuário';if(cancel)cancel.classList.add('hidden');if(pwd)pwd.placeholder='Digite a senha'}
function editAdminUser(id){const u=state.users.find(x=>x.id===id);if(!u)return;document.getElementById('editUserId').value=u.id;document.getElementById('newUserName').value=u.name;document.getElementById('newUsername').value=u.username;document.getElementById('newUserPassword').value='';document.getElementById('newUserPassword').placeholder='Deixe em branco para manter a senha atual';document.getElementById('saveUserBtn').textContent='Salvar alterações';document.getElementById('cancelUserEditBtn').classList.remove('hidden');document.getElementById('newUserName').scrollIntoView({behavior:'smooth',block:'center'})}
function cancelUserEdit(){resetUserForm()}
async function saveAdminUser(e){e.preventDefault();const id=document.getElementById('editUserId').value;const name=document.getElementById('newUserName').value.trim();const username=document.getElementById('newUsername').value.trim();const password=document.getElementById('newUserPassword').value;if(!name||!username){toast('Informe nome e usuário.');return}if(state.users.some(u=>u.id!==id&&u.username.toLowerCase()===username.toLowerCase())){toast('Já existe um usuário com esse login.');return}if(!id&&!password){toast('Informe uma senha para o novo usuário.');return}const current=id?state.users.find(u=>u.id===id):null;if(id&&!current){toast('Usuário não encontrado.');return}const passwordHash=password?await hashPassword(password):(current?.passwordHash||'');const record={id:current?.id||crypto.randomUUID(),name,username,passwordHash,role:'Administrador',active:true};if(id){state.users=state.users.map(u=>u.id===id?record:u);if(currentUsername().toLowerCase()===String(current.username).toLowerCase())refreshSessionUsername(username)}else state.users.push(record);saveState();await persistUsersAndSync(id?'Atualiza usuário administrativo':'Cria usuário administrativo');renderSettings()}
async function removeAdminUser(id){const user=state.users.find(u=>u.id===id);if(!user)return;if(state.users.filter(u=>u.active!==false).length<=1){toast('É necessário manter pelo menos um usuário ativo.');return}if(currentUsername().toLowerCase()===user.username.toLowerCase()){toast('Você não pode remover o usuário que está conectado.');return}if(!confirm(`Remover o usuário ${user.username}?`))return;state.users=state.users.filter(u=>u.id!==id);saveState();await persistUsersAndSync('Remove usuário administrativo');renderSettings()}

function openBookingModal(id='',presetDate='',presetResource=''){
 const b=id?state.bookings.find(x=>x.id===id):null;document.getElementById('modalTitle').textContent=b?'Editar agendamento':'Novo agendamento';document.getElementById('bookingId').value=b?.id||'';
 const area=b?bookingCategory(b):'lab';document.getElementById('bookingArea').value=area;
 const selected=b?.resourceId||presetResource||state.resources.find(r=>r.active)?.id||'__custom__';const isCustom=String(selected).startsWith('custom:');
 populateBookingResources(isCustom?'__custom__':selected);
 document.getElementById('customSpaceName').value=isCustom?(b?.customSpaceName||(presetResource?state.bookings.find(x=>x.resourceId===presetResource)?.customSpaceName:'')||''):'';
 toggleCustomSpace();
 document.getElementById('responsible').value=b?.responsible||'';setPurposeField(b?.purpose||'');
 document.getElementById('startDate').value=b?.date||presetDate||localISO(new Date());document.getElementById('endDate').value=b?.date||presetDate||localISO(new Date());document.getElementById('startTime').value=b?.startTime||'08:00';document.getElementById('endTime').value=b?.endTime||'11:10';document.getElementById('repeat').value='none';document.getElementById('repeat').disabled=!!b;document.getElementById('status').value=b?.status||'confirmed';document.getElementById('notes').value=b?.notes||'';
 const preset=!b?'morning':b.startTime==='08:00'&&b.endTime==='11:10'?'morning':b.startTime==='13:00'&&b.endTime==='17:00'?'afternoon':b.startTime==='19:00'&&b.endTime==='22:00'?'evening':b.startTime==='08:00'&&b.endTime==='09:30'?'morning1':b.startTime==='09:40'&&b.endTime==='11:10'?'morning2':b.startTime==='13:00'&&b.endTime==='15:00'?'afternoon1':b.startTime==='15:00'&&b.endTime==='17:00'?'afternoon2':b.startTime==='19:00'&&b.endTime==='20:30'?'evening1':b.startTime==='20:30'&&b.endTime==='22:00'?'evening2':b.startTime==='18:50'&&b.endTime==='20:20'?'classnight1':b.startTime==='20:30'&&b.endTime==='22:00'?'evening2':'custom';document.getElementById('periodType').value=b?preset:'morning';document.getElementById('bookingAlert').classList.add('hidden');
 let foot=document.querySelector('#bookingModal .modal-foot');const old=document.getElementById('deleteBtn');if(old)old.remove();if(b){const del=document.createElement('button');del.type='button';del.id='deleteBtn';del.className='btn btn-danger';del.textContent='Excluir';del.onclick=()=>deleteBooking(b.id);foot.prepend(del)}
 document.getElementById('bookingModal').classList.remove('hidden');
}
function populateBookingResources(selected=''){
 const area=document.getElementById('bookingArea')?.value||'lab';const sel=document.getElementById('resourceId');if(!sel)return;
 if(area==='classroom'){
   sel.innerHTML='<option value="__custom__">Sala de aula — informar nome</option>';sel.value='__custom__';
 }else{
   sel.innerHTML=state.resources.filter(r=>r.active&&r.id!=='volante').map(r=>`<option value="${r.id}">${escapeHtml(r.name)}</option>`).join('')+'<option value="__custom__">Outro espaço — digitar nome</option>';
   if(selected&&[...sel.options].some(o=>o.value===selected))sel.value=selected;else if(!sel.value)sel.value=state.resources.find(r=>r.active)?.id||'__custom__';
 }
 toggleCustomSpace();
}
function toggleBookingArea(){
 const area=document.getElementById('bookingArea')?.value||'lab';const input=document.getElementById('customSpaceName');const hint=document.getElementById('bookingAreaHint');
 populateBookingResources();
 if(input){input.value='';input.placeholder=area==='classroom'?'Ex.: Sala 04, Sala 12, Biblioteca...':'Ex.: Sala 12, Biblioteca, Hall, Sala de Reuniões...'}
 if(hint)hint.textContent=area==='classroom'?'Use para uma reserva ou mudança pontual de sala. Ela aparecerá no Painel de Salas de Aula.':'Reserva de laboratório, auditório ou outro espaço institucional.';
}
function toggleCustomSpace(){const sel=document.getElementById('resourceId'),field=document.getElementById('customSpaceField'),input=document.getElementById('customSpaceName'),label=field?.querySelector('label');if(!sel||!field||!input)return;const area=document.getElementById('bookingArea')?.value||'lab';const custom=sel.value==='__custom__';field.classList.toggle('hidden',!custom);input.required=custom;if(label)label.textContent=area==='classroom'?'Informe a sala de aula *':'Informe o espaço *';if(area==='classroom')input.placeholder='Ex.: Sala 04';if(custom)setTimeout(()=>input.focus(),0)}
function predefinedPurposeValues(){return [...document.querySelectorAll('#purpose option')].map(o=>o.value).filter(v=>v&&v!=='__custom_purpose__')}
function setPurposeField(value=''){const sel=document.getElementById('purpose'),field=document.getElementById('customPurposeField'),input=document.getElementById('customPurpose');if(!sel||!field||!input)return;const v=String(value||'').trim();if(!v){sel.value='';input.value=''}else if(predefinedPurposeValues().includes(v)){sel.value=v;input.value=''}else{sel.value='__custom_purpose__';input.value=v}toggleCustomPurpose()}
function toggleCustomPurpose(){const sel=document.getElementById('purpose'),field=document.getElementById('customPurposeField'),input=document.getElementById('customPurpose');if(!sel||!field||!input)return;const custom=sel.value==='__custom_purpose__';field.classList.toggle('hidden',!custom);input.required=custom;if(custom)setTimeout(()=>input.focus(),0)}
function selectedPurpose(){const sel=document.getElementById('purpose');if(!sel)return '';return sel.value==='__custom_purpose__'?(document.getElementById('customPurpose')?.value.trim()||''):sel.value.trim()}
function closeBookingModal(){document.getElementById('bookingModal').classList.add('hidden')}
function applyPeriodPreset(){const type=document.getElementById('periodType').value;const map={morning:['08:00','11:10'],afternoon:['13:00','17:00'],evening:['19:00','22:00'],morning1:['08:00','09:30'],morning2:['09:40','11:10'],afternoon1:['13:00','15:00'],afternoon2:['15:00','17:00'],evening1:['19:00','20:30'],evening2:['20:30','22:00'],classnight1:['18:50','20:20'],classnight2:['20:30','22:00']};if(map[type]){document.getElementById('startTime').value=map[type][0];document.getElementById('endTime').value=map[type][1]}}
function datesBetween(start,end,repeat){let out=[];let d=parseLocal(start),last=parseLocal(end);if(repeat==='none')return [start];while(d<=last){if(repeat==='weekdays'){if(d.getDay()!==0&&d.getDay()!==6)out.push(localISO(d));d=addDays(d,1)}else{out.push(localISO(d));d=addDays(d,7)}}return out}
function overlaps(aStart,aEnd,bStart,bEnd){return aStart<bEnd&&aEnd>bStart}

// Conferência cruzada de professor, turma e local.
function normalizePersonName(v=''){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\b(professor|professora|prof)\b/g,' ').replace(/[^a-z0-9]+/g,' ').replace(/\s+/g,' ').trim()}
function isTrackableProfessor(v=''){const n=normalizePersonName(v);return !!n&&!['processo seletivo','professor a definir','a definir','nao informado','sem professor'].includes(n)}
function sameProfessor(a,b){return isTrackableProfessor(a)&&isTrackableProfessor(b)&&normalizePersonName(a)===normalizePersonName(b)}
function samePurpose(a,b){const ra=String(a||'').trim(),rb=String(b||'').trim();if(!ra||!rb)return false;return normalizeSpaceName(ra)===normalizeSpaceName(rb)}
function professorBookings(name,date,startTime,endTime,ignoreId='',confirmedOnly=false){
 if(!isTrackableProfessor(name))return [];
 return state.bookings.filter(b=>b.id!==ignoreId&&b.date===date&&(confirmedOnly?b.status==='confirmed':b.status!=='cancelled')&&sameProfessor(b.responsible,name)&&overlaps(startTime,endTime,b.startTime,b.endTime));
}
function professorBaselineEntries(name,date,startTime,endTime){
 if(!isTrackableProfessor(name))return [];const d=parseLocal(date),weekday=d.getDay();if(weekday<1||weekday>5||!semesterContainsDate(d))return [];
 return (state.classSchedule||[]).filter(e=>e.weekday===weekday&&sameProfessor(e.professor,name)&&overlaps(startTime,endTime,e.startTime,e.endTime));
}
function bookingProfessorConflicts(b){
 if(!b||b.status!=='confirmed'||!isTrackableProfessor(b.responsible))return [];
 return professorBookings(b.responsible,b.date,b.startTime,b.endTime,b.id,true).filter(x=>x.resourceId!==b.resourceId);
}
function uniqueBookingLocations(bookings){const m=new Map();bookings.forEach(b=>{const name=bookingResourceName(b);m.set(normalizeRoomName(name),name)});return [...m.values()]}
function roomAssignmentConflicts(assignments){
 const entries=state.classSchedule||[];const out=[];
 for(let i=0;i<entries.length;i++)for(let j=i+1;j<entries.length;j++){const a=entries[i],b=entries[j];if(a.purpose===b.purpose||a.weekday!==b.weekday||!overlaps(a.startTime,a.endTime,b.startTime,b.endTime))continue;const ra=(assignments?.[a.purpose]||'').trim(),rb=(assignments?.[b.purpose]||'').trim();if(ra&&rb&&normalizeRoomName(ra)===normalizeRoomName(rb))out.push({room:ra,a,b})}
 return out;
}

function normalizeRoomName(v=''){return normalizeSpaceName(v)}
function classroomBaselineConflicts(room,date,startTime,endTime,purpose=''){
 const d=parseLocal(date);const weekday=d.getDay();if(weekday<1||weekday>5)return [];
 const normalized=normalizeRoomName(room);
 return (state.classSchedule||[]).filter(e=>e.weekday===weekday&&e.purpose!==purpose&&overlaps(startTime,endTime,e.startTime,e.endTime)&&normalizeRoomName(state.roomAssignments?.[e.purpose]||'')===normalized&&normalized);
}
async function saveBooking(e){
 e.preventDefault();const id=document.getElementById('bookingId').value;const area=document.getElementById('bookingArea').value||'lab';const selectedResource=document.getElementById('resourceId').value;const customSpaceName=document.getElementById('customSpaceName').value.trim();const resourceId=selectedResource==='__custom__'?makeCustomResourceId(customSpaceName):selectedResource;const startDate=document.getElementById('startDate').value,endDate=document.getElementById('endDate').value,startTime=document.getElementById('startTime').value,endTime=document.getElementById('endTime').value,repeat=document.getElementById('repeat').value;
 const alert=document.getElementById('bookingAlert');const purpose=selectedPurpose();if(selectedResource==='__custom__'&&!customSpaceName){alert.textContent=area==='classroom'?'Informe a sala de aula que será utilizada.':'Informe o nome do espaço que será utilizado.';alert.classList.remove('hidden');return}if(document.getElementById('purpose').value==='__custom_purpose__'&&!purpose){alert.textContent='Informe a turma, curso ou evento.';alert.classList.remove('hidden');return}if(endDate<startDate||endTime<=startTime){alert.textContent='Verifique as datas e os horários informados.';alert.classList.remove('hidden');return}
 const dates=datesBetween(startDate,endDate,repeat);const conflicts=dates.filter(date=>state.bookings.some(b=>b.id!==id&&b.resourceId===resourceId&&b.date===date&&b.status!=='cancelled'&&overlaps(startTime,endTime,b.startTime,b.endTime)));
 if(conflicts.length){alert.textContent=`Conflito encontrado em ${conflicts.slice(0,3).map(x=>formatDate(parseLocal(x),{day:'2-digit',month:'2-digit'})).join(', ')}. O espaço já possui agendamento nesse horário.`;alert.classList.remove('hidden');return}
 const responsible=document.getElementById('responsible').value.trim();
 if(isTrackableProfessor(responsible)){
   const manualProfessorConflicts=dates.flatMap(date=>professorBookings(responsible,date,startTime,endTime,id,false).map(b=>({date,b})));
   if(manualProfessorConflicts.length){const c=manualProfessorConflicts[0];alert.textContent=`Conflito de professor: ${responsible} já possui agendamento em ${bookingResourceName(c.b)} em ${formatDate(parseLocal(c.date),{day:'2-digit',month:'2-digit'})}, das ${c.b.startTime} às ${c.b.endTime}. Um professor não pode ficar em dois locais no mesmo horário.`;alert.classList.remove('hidden');return}
   const baselineProfessorConflicts=dates.flatMap(date=>professorBaselineEntries(responsible,date,startTime,endTime).filter(e=>!samePurpose(e.purpose,purpose)).map(e=>({date,e})));
   if(baselineProfessorConflicts.length){const c=baselineProfessorConflicts[0];alert.textContent=`Conflito com a grade: ${responsible} consta em ${c.e.purpose} em ${formatDate(parseLocal(c.date),{day:'2-digit',month:'2-digit'})}, das ${c.e.startTime} às ${c.e.endTime}. Para mover a própria turma para outro espaço, selecione a mesma turma do agendamento.`;alert.classList.remove('hidden');return}
 }
 if(area==='classroom'){
   const baselineConflicts=dates.flatMap(date=>classroomBaselineConflicts(customSpaceName,date,startTime,endTime,purpose).map(x=>({date,entry:x})));
   if(baselineConflicts.length){const c=baselineConflicts[0];alert.textContent=`A sala ${customSpaceName} já está vinculada a ${c.entry.purpose} em ${formatDate(parseLocal(c.date),{day:'2-digit',month:'2-digit'})}, no horário ${c.entry.startTime}–${c.entry.endTime}.`;alert.classList.remove('hidden');return}
 }
 const base={spaceCategory:area,resourceId,...(selectedResource==='__custom__'?{customSpaceName}:{}),responsible,purpose,startTime,endTime,status:document.getElementById('status').value,notes:document.getElementById('notes').value.trim()};
 if(id){const idx=state.bookings.findIndex(b=>b.id===id);const previous=state.bookings[idx]||{};state.bookings[idx]={...previous,...base,date:startDate};if(selectedResource!=='__custom__')delete state.bookings[idx].customSpaceName}else dates.forEach(date=>state.bookings.push({id:crypto.randomUUID(),...base,date}));
 closeBookingModal();renderAdmin();await persistAndSync(id?'Atualiza agendamento':'Cria agendamento');

function classroomEntriesForPeriod(date,periodId){
 const slot=classroomSlotById(periodId),weekday=date.getDay(),iso=localISO(date);
 if(weekday<1||weekday>5||!semesterContainsDate(date))return [];
 const baseline=(state.classSchedule||[]).filter(e=>e.weekday===weekday&&e.startTime===slot.start&&e.endTime===slot.end).map(e=>({...e,room:(state.roomAssignments?.[e.purpose]||'').trim(),manual:false}));
 const allBookings=state.bookings.filter(b=>b.status==='confirmed'&&b.date===iso&&overlaps(slot.start,slot.end,b.startTime,b.endTime));
 const consumed=new Set();
 const resolved=baseline.map(entry=>{
   // Uma reserva explícita da mesma turma é a fonte de verdade para o local daquele dia.
   const sameClass=allBookings.filter(b=>samePurpose(b.purpose,entry.purpose));
   if(sameClass.length){
     sameClass.forEach(b=>consumed.add(b.id));const locations=uniqueBookingLocations(sameClass);
     if(locations.length>1){return {...entry,room:'CONFLITO DE LOCAL',conflict:true,conflictText:`A mesma turma aparece em: ${locations.join(' × ')}`,manual:true}}
     const chosen=sameClass[0];
     return {...entry,room:bookingResourceName(chosen),professor:chosen.responsible||entry.professor,manual:true,relocationCategory:bookingCategory(chosen),bookingId:chosen.id};
   }
   // Se o professor foi agendado em outro local para outra atividade, não mostramos dois locais: sinalizamos o conflito.
   const sameProf=isTrackableProfessor(entry.professor)?allBookings.filter(b=>sameProfessor(b.responsible,entry.professor)):[];
   if(sameProf.length){
     sameProf.forEach(b=>consumed.add(b.id));const locations=uniqueBookingLocations(sameProf);
     return {...entry,room:'CONFLITO DE HORÁRIO',conflict:true,conflictText:`${entry.professor} também consta em ${locations.join(' × ')} neste horário.`,manual:true};
   }
   if(String(entry.room||'').includes('VERIFICAR')){
     return {...entry,conflict:true,conflictText:`A relação de salas recebida informa mais de uma sala-base para ${entry.purpose}. Confira a sala correta em Grade de salas.`};
   }
   return entry;
 });
 const manual=allBookings.filter(b=>bookingCategory(b)==='classroom'&&!consumed.has(b.id)).map(b=>({id:'manual-'+b.id,purpose:b.purpose||'Reserva de sala',course:'',phase:'',weekday,startTime:b.startTime,endTime:b.endTime,professor:b.responsible,room:bookingResourceName(b),manual:true,relocationCategory:'classroom',bookingId:b.id}));
 return [...resolved,...manual].sort((a,b)=>{
   if(a.conflict!==b.conflict)return a.conflict?-1:1;const ar=(a.room||'zzzz').toLocaleLowerCase('pt-BR'),br=(b.room||'zzzz').toLocaleLowerCase('pt-BR');
   return ar.localeCompare(br,'pt-BR')||a.purpose.localeCompare(b.purpose,'pt-BR');
 });
}

 const tag=entry.conflict?'VERIFICAR':lab?'LABORATÓRIO':entry.manual?'AJUSTE':'GRADE';
 const detail=entry.conflict?`<div class="classroom-conflict-detail">⚠ ${escapeHtml(entry.conflictText||'Professor ou turma com mais de um local no mesmo horário.')}</div>`:'';
 return `<article class="classroom-card ${cls}">
   <div class="classroom-room"><h2>${escapeHtml(room||'A DEFINIR')}</h2><span class="room-tag">${tag}</span></div>
   <div class="classroom-professor">${escapeHtml(entry.professor||'Professor a definir')}</div>
   <div class="classroom-course">${escapeHtml(entry.purpose||'Turma')}</div>
   <div class="classroom-time">◷ ${entry.startTime}–${entry.endTime}</div>${detail}
 </article>`;
}
function renderClassroomPublic(resetTimer=true){
 if(window.classroomAutoDate===undefined)window.classroomAutoDate=true;
 if(!window.classroomPeriod)window.classroomPeriod='auto';
 const selected=window.classroomAutoDate?new Date():(window.classroomDate||new Date());window.classroomDate=selected;
 const autoState=window.classroomPeriod==='auto'?classroomAutoState(selected):{type:'period',periodId:window.classroomPeriod};
 const periodId=autoState.type==='period'?autoState.periodId:null;const slot=periodId?classroomSlotById(periodId):null;
 const entries=slot?classroomEntriesForPeriod(selected,periodId):[];const unassigned=entries.filter(e=>!String(e.room||'').trim()).length;const crossConflicts=entries.filter(e=>e.conflict).length;const inLabs=entries.filter(e=>e.relocationCategory==='lab'&&!e.conflict).length;
 const outside=!semesterContainsDate(selected);const weekend=selected.getDay()===0||selected.getDay()===6;
 const emptyText=outside?'Data fora do período letivo 2026/2.':weekend?'Não há grade regular de salas aos finais de semana.':autoState.type!=='period'?autoState.message:'Nenhuma aula encontrada para este período.';
 const autoLabel=autoState.type==='period'?slot.label:autoState.title;const autoExtra=autoState.next?` · próximo horário ${autoState.next}`:'';
 const mainEmptyTitle=autoState.type==='interval'?'INTERVALO':autoState.type==='idle'?autoState.title:'Sem aulas neste período';
 document.getElementById('app').innerHTML=`<section class="classroom-page"><header class="public-header"><div class="public-brand">${logoMarkup()}<div><h1>${escapeHtml(state.settings.classroomPanelTitle||'Painel de Salas de Aula')}</h1><p>${escapeHtml(state.settings.appName)} · Grade ${SEMESTER_2026_2.label}</p></div></div><div class="public-clock"><strong id="clock">--:--</strong><span id="clockDate"></span></div></header>
 <div class="public-toolbar"><div class="date-nav"><button class="icon-btn" onclick="moveClassroomDate(-1)">‹</button><button class="btn fullscreen-btn" onclick="goClassroomToday()">Hoje</button><button class="icon-btn" onclick="moveClassroomDate(1)">›</button><div class="date-label">${formatDate(selected,{weekday:'long',day:'2-digit',month:'long'})}</div></div><div class="classroom-periods"><button class="${window.classroomPeriod==='auto'?'active':''}" onclick="setClassroomPeriod('auto')">Automático</button>${CLASSROOM_PERIODS.map(p=>`<button class="${window.classroomPeriod===p.id?'active':''}" onclick="setClassroomPeriod('${p.id}')">${p.label}</button>`).join('')}</div><div style="display:flex;gap:9px;flex-wrap:wrap"><button class="btn fullscreen-btn" onclick="location.hash='#painel-labs'">▦ Laboratórios</button><button class="btn fullscreen-btn" onclick="toggleFullscreen()">⛶ Tela cheia</button><button class="btn fullscreen-btn" onclick="requestAdminLogin()">Administração</button></div></div>
 <div class="classroom-panel-note"><span><b>${window.classroomPeriod==='auto'?'Período automático':'Período selecionado'}:</b> ${escapeHtml(autoLabel)}${autoExtra}${slot?` · ${entries.length} turma${entries.length===1?'':'s'} · ${inLabs} em laboratório`:''}</span><span>${slot?(crossConflicts?`⚠ ${crossConflicts} conflito${crossConflicts===1?'':'s'} de professor/local — revisar`:unassigned?`⚠ ${unassigned} turma${unassigned===1?'':'s'} com sala a definir`:'✓ Conferência automática ativa · locais consistentes'):'✓ Troca automática de horário ativa'}</span></div>
 <div class="classroom-grid">${entries.length?entries.map(classroomCard).join(''):`<div class="classroom-empty"><div><strong>${escapeHtml(mainEmptyTitle)}</strong><span>${escapeHtml(emptyText)}</span></div></div>`}</div>
 <footer class="public-foot"><span>Grade semestral ${SEMESTER_2026_2.label} · alterações pontuais podem ser feitas pela administração</span><span id="publicSync" class="sync-note">Dados carregados</span></footer></section>`;
 updateClock();updatePublicSyncNote();scheduleClassroomMidnightRollover();scheduleClassroomPeriodTransition();clearInterval(window.publicTimer);
 if(resetTimer){clearInterval(window.classroomTimer);const seconds=Math.max(30,Number(state.settings.publicRefreshSeconds)||60);window.classroomTimer=setInterval(async()=>{updateClock();ensureClassroomCurrentDay();if(window.classroomAutoDate)await syncPublic(true);else renderClassroomPublic(false)},seconds*1000)}
}
function setClassroomPeriod(id){window.classroomPeriod=id;renderClassroomPublic()}
function moveClassroomDate(n){window.classroomAutoDate=false;window.classroomDate=addDays(window.classroomDate||new Date(),n);renderClassroomPublic()}
function goClassroomToday(){window.classroomAutoDate=true;window.classroomDate=new Date();window.classroomPeriod='auto';renderClassroomPublic()}
function ensureClassroomCurrentDay(){if(!window.classroomAutoDate)return false;const now=new Date();if(!window.classroomDate||localISO(window.classroomDate)!==localISO(now)){window.classroomDate=now;if(location.hash==='#painel-salas')renderClassroomPublic(false);return true}if(location.hash==='#painel-salas'&&window.classroomPeriod==='auto')renderClassroomPublic(false);return false}
function scheduleClassroomMidnightRollover(){clearTimeout(window.classroomMidnightTimer);const now=new Date();const nextMidnight=new Date(now);nextMidnight.setHours(24,0,1,0);window.classroomMidnightTimer=setTimeout(async()=>{if(location.hash==='#painel-salas'&&window.classroomAutoDate){window.classroomDate=new Date();window.classroomPeriod='auto';renderClassroomPublic(false);await syncPublic(true)}scheduleClassroomMidnightRollover()},Math.max(1000,nextMidnight.getTime()-now.getTime()))}

function updateClock(){const now=new Date();const c=document.getElementById('clock'),d=document.getElementById('clockDate');if(c)c.textContent=now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});if(d)d.textContent=formatDate(now,{day:'2-digit',month:'2-digit',year:'numeric'})}
function toggleFullscreen(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()}
async function bootstrap(){try{const [bookings,grade]=await Promise.all([fetchPublicJson(),fetchPublicGrade()]);mergeRemoteData(bookings);mergeGradeData(grade);try{const users=await fetchPublicUsers();mergeUsersData(users)}catch(e){}syncInfo={status:'ok',last:new Date(),message:'Agendamentos, grade e usuários carregados'};}catch(e){syncInfo={status:'error',last:null,message:e.message}}route();}
bootstrap();
setInterval(enforceSessionExpiry,15000);
</script>
</body>
